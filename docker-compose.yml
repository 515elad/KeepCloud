# Local demo stack: KeepAir + PostgreSQL 16. Development and demo only.
# The database passwords below are local defaults, not secrets. Real
# deployments supply the KEEPAIR_*_DATABASE_URL values from their own secret store.
#
# Two database roles: "keepair" owns the tables and is used only by the UI
# container's start-up step (migrations and the demo seed). The running services
# connect as "keepair_app", which cannot change or delete audit records.
x-app-env: &app-env
  KEEPAIR_ENV: demo
  KEEPAIR_DEMO_MODE: "true"
  KEEPAIR_DATABASE_URL: postgresql+psycopg://keepair_app:${KEEPAIR_APP_DB_PASSWORD:-keepair_app}@db:5432/keepair
  KEEPAIR_MOCK_PROVIDER_URL: http://mock-provider:8090
  KEEPAIR_GATEWAY_URL: http://gateway:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keepair
      POSTGRES_PASSWORD: ${KEEPAIR_DB_PASSWORD:-keepair}
      POSTGRES_DB: keepair
    # The database is not published on the host: only the services in this stack
    # need it, and port 5432 is often taken by another PostgreSQL.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepair -d keepair"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The UI. Runs the migrations and loads the demo data at start, as the owner role.
  app:
    build: .
    environment:
      <<: *app-env
      KEEPAIR_OWNER_DATABASE_URL: postgresql+psycopg://keepair:${KEEPAIR_DB_PASSWORD:-keepair}@db:5432/keepair
      KEEPAIR_APP_DB_PASSWORD: ${KEEPAIR_APP_DB_PASSWORD:-keepair_app}
      # Key for the stored authenticator secrets. ./run.sh generates it into .env.
      KEEPAIR_MFA_KEY: ${KEEPAIR_MFA_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEEPAIR_UI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 60
    read_only: true
    tmpfs:
      - /tmp

  # The gateway: a separate listener with no admin routes (SEC-14).
  gateway:
    build: .
    command: ["uvicorn", "keepair.gateway.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *app-env
      # Fail-open spool: kept on a volume and encrypted with a key that ./run.sh
      # generates into .env (not in git). Without a key the gateway uses a
      # throwaway one and spooled records do not survive a restart.
      KEEPAIR_SPOOL_DIR: /spool
      KEEPAIR_SPOOL_KEY: ${KEEPAIR_SPOOL_KEY:-}
    volumes:
      - spool:/spool
    depends_on:
      app:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEEPAIR_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 60
    read_only: true
    tmpfs:
      - /tmp

  # A stand-in model vendor. It calls nothing and needs no key.
  mock-provider:
    build: .
    command: ["uvicorn", "keepair.mockprovider.main:app", "--host", "0.0.0.0", "--port", "8090"]
    environment: *app-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 60
    read_only: true
    tmpfs:
      - /tmp

  # Sends the scripted demo traffic:  docker compose run --rm demo-traffic
  demo-traffic:
    build: .
    command: ["python", "-m", "keepair.demo.traffic"]
    environment: *app-env
    depends_on:
      - gateway
    profiles: ["demo"]
    read_only: true
    tmpfs:
      - /tmp

volumes:
  spool:
