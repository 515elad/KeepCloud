name: CI

# Offline checks only: no job needs a secret, a provider key or a provider call.
on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          uv venv
          uv pip sync --require-hashes requirements-dev.lock
          uv pip install --no-deps -e .
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Secret scan
        run: scripts/secret_scan.sh
      - name: Tests (PostgreSQL 16 via testcontainers)
        run: .venv/bin/pytest --cov --cov-report=term-missing
