# The "i" information registry. Every field, column and KPI in the UI reads its
# help text from here. Keys are stable field IDs: do not rename them.
#
# Tests (tests/system/test_field_help.py) fail when:
#   - the UI shows a field that has no entry here,
#   - an entry is missing its unit, or a calculated entry is missing its formula,
#   - a worked example no longer matches what the code computes on the demo data.
fields:
  health.component:
    name: Component
    meaning: A part of KeepAir that must be running for the controls to work. Each one reports that it is alive by sending a heartbeat.
    unit: Text. One of gateway, policy_sync, ledger, egress, alerting, data_sources.
    source: system
    source_detail: Fixed list defined in the application (keepair.health.COMPONENTS).
    worked_example:
      description: The first component in the health strip.
      result: gateway
    allowed_range: Only the six listed components.
    validation: A heartbeat for any other component name is rejected.
    prd_ref: UX-6 (health strip), FR-21 (heartbeats)

  health.status:
    name: Status
    meaning: Whether a component is known to be working, judged by how recent its last heartbeat is. Unknown means there is no evidence either way, and it is never shown as healthy.
    unit: Text. One of Healthy, Degraded, Failing, Unknown.
    source: calculated
    source_detail: Calculated on each page load from the last heartbeat and the current time.
    formula: |
      age_s = now - last_heartbeat_at
      status = Unknown   when last_heartbeat_at is none, or age_s < 0
      status = Healthy   when age_s <= degraded_after_s
      status = Degraded  when age_s <= failing_after_s
      status = Failing   otherwise
    formula_fn: health_status
    worked_example:
      description: The gateway component in the demo data. No heartbeat has been recorded yet, so the status is Unknown.
      inputs:
        component: gateway
        last_heartbeat_at: none
        now: "2026-01-15T09:00:00Z"
        degraded_after_s: "60"
        failing_after_s: "180"
      result: Unknown
    allowed_range: Exactly one of the four states.
    validation: A heartbeat dated in the future is not trusted and gives Unknown.
    prd_ref: UX-6 (health strip), FR-21 (control assurance), SEC-37

  health.last_heartbeat_at:
    name: Last heartbeat
    meaning: The last time the component reported that it is alive. "never" means no heartbeat has been received.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Written by each component when it sends a heartbeat (table heartbeats).
    worked_example:
      description: The gateway component in the demo data has not sent a heartbeat.
      result: never
    allowed_range: Any past time, or never.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: FR-21 (heartbeats), SEC-37

  demo.clock:
    name: Demo data as of
    meaning: The fixed moment the demo data set was generated for. It never changes, so the demo data is identical on every run.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: seed script
    source_detail: Set by the demo seed script (keepair.demo.seed) together with a fixed random seed.
    worked_example:
      description: The value in the demo data.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: One fixed value per demo data set.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: Section 2.3 of the v1.4 build spec (injected clock and seed)

  alert.raised_at:
    name: Raised
    meaning: When the failure was detected.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Set from the application clock when the failure is reported.
    worked_example:
      description: The demo data starts with no alerts. A database outage detected at the demo clock time would show this value.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: FR-21 (failure visibility), SEC-36

  alert.severity:
    name: Severity
    meaning: How urgent the alert is. SEV1 is the most urgent.
    unit: Text. One of SEV1, SEV2, SEV3.
    source: system
    source_detail: Fixed per reason code in the application (keepair.failures.FAILURE_CODES).
    worked_example:
      description: A database outage (DATABASE_UNREACHABLE) is raised as SEV2.
      result: SEV2
    allowed_range: SEV1, SEV2 or SEV3.
    validation: Any other value is rejected by the database.
    prd_ref: FR-21 (alert severities), FR-22

  alert.code:
    name: Code
    meaning: The stable reason code for the failure. Use it to search logs and runbooks.
    unit: Text, upper case with underscores.
    source: system
    source_detail: Chosen from the registered list of failure codes when the failure is reported.
    worked_example:
      description: The code raised when the database cannot be reached.
      result: DATABASE_UNREACHABLE
    allowed_range: Only codes registered in the application.
    validation: Reporting an unregistered code is refused.
    prd_ref: SEC-36 (no silent failure), SEC-11 (stable reason codes)

  alert.component:
    name: Affected component
    meaning: The part of KeepAir the failure belongs to.
    unit: Text.
    source: system
    source_detail: Fixed per reason code in the application.
    worked_example:
      description: A database outage affects the ledger.
      result: ledger
    allowed_range: A health strip component, or app for the web application itself.
    validation: Set by the application. It cannot be entered by a user.
    prd_ref: FR-21 (failure visibility), UX-6

  alert.message:
    name: What happened
    meaning: A plain-language description of the failure and its effect.
    unit: Text.
    source: system
    source_detail: Written by the application when the failure is reported. It never contains request content or credentials.
    worked_example:
      description: The message for a database outage.
      result: The database could not be reached. Component health and demo data cannot be read, so every component is shown as Unknown.
    allowed_range: Free text written by the application.
    validation: Escaped when shown. Never built from user input.
    prd_ref: SEC-36 (no silent failure), SEC-34 (redaction)

  budget.scope:
    name: Budget
    meaning: The part of the organization this budget belongs to. Budgets follow the hierarchy of organization, department, team and project.
    unit: Text. The scope name, with its level underneath.
    source: seed script
    source_detail: Demo hierarchy from the seed script. Budgets cannot be created in the UI yet.
    worked_example:
      description: A project budget in the demo data.
      result: Research Agent (Project)
    allowed_range: One budget per scope and period.
    validation: The database refuses a second budget for the same scope, period and start date.
    prd_ref: FR-04 (hierarchical budgets)

  project.coverage:
    name: Coverage
    meaning: How much control KeepAir has over a project's AI spend. Enforced is shown only when the gateway is used, KeepAir holds the provider key, and egress control is verified.
    unit: Text. One of Enforced, Gateway-routed, Monitored, Uncontrolled.
    source: calculated
    source_detail: Calculated from the project's key custody, its egress check and any uncontrolled-spend finding.
    formula: |
      coverage = Uncontrolled    when uncontrolled_finding is yes
      coverage = Monitored       when key_custody is not KEEPAIR
      coverage = Enforced        when egress_verified is yes
      coverage = Gateway-routed  otherwise
    formula_fn: coverage_state
    worked_example:
      description: The Research Agent project in the demo data. KeepAir holds the key, but egress control is not verified.
      inputs:
        project: Research Agent
        key_custody: KEEPAIR
        egress_verified: "no"
        uncontrolled_finding: "no"
      result: Gateway-routed
    allowed_range: Exactly one of the four states. Enforced cannot appear in the MVP because egress control (FR-20) is not built.
    validation: Calculated only. It cannot be set by hand.
    prd_ref: UX-2 (coverage badge), UX-D1 (pending decision, default Gateway-routed), FR-20

  budget.policy:
    name: Policy
    meaning: What happens when spend reaches the cap. Monitor and Soft limit only report; Hard limit and Approval limit spend.
    unit: Text. One of Monitor, Soft limit, Hard limit, Approval.
    source: seed script
    source_detail: Set per budget. Demo values come from the seed script.
    worked_example:
      description: The Research Agent project budget in the demo data.
      result: Approval
    allowed_range: MONITOR, SOFT, HARD or APPROVAL.
    validation: Any other value is rejected by the database. A hard limit will also need an owner from phase 5.
    prd_ref: FR-05 (policy modes), FR-04

  budget.mode:
    name: Mode
    meaning: Whether the budget stands alone or is a share of its parent. A Subdivision budget is also limited by its parent; an Independent budget is not.
    unit: Text. Independent or Subdivision.
    source: seed script
    source_detail: Set per budget. The default is Independent.
    worked_example:
      description: The Research Agent project budget is a share of the Agents team budget.
      result: Subdivision
    allowed_range: INDEPENDENT or SUBDIVISION.
    validation: A Subdivision budget must have a parent in the same currency.
    prd_ref: FR-04 (independent cap or subdivision)

  budget.period:
    name: Period
    meaning: The time span the cap applies to.
    unit: Period type, then first and last day as ISO 8601 dates.
    source: seed script
    source_detail: Set per budget. Demo values come from the seed script.
    worked_example:
      description: The Research Agent project budget.
      result: Month, 2026-01-01 to 2026-01-31
    allowed_range: Month, Quarter or Year.
    validation: Any other period is rejected by the database.
    prd_ref: FR-04 (monthly, quarterly and annual budgets)

  budget.cap:
    name: Cap
    meaning: The most this budget may spend in its period.
    unit: Money in the budget's currency. Stored as micro-units (1 unit = 1,000,000 micro-units), shown with two decimals and the ISO 4217 code.
    source: seed script
    source_detail: Set per budget. Demo values come from the seed script.
    worked_example:
      description: The Research Agent project budget.
      result: 35,000.00 USD
    allowed_range: 0 or more.
    validation: Whole micro-units, never negative. The currency must be a three-letter ISO 4217 code.
    prd_ref: FR-04, FR-02 (money as micro-units)

  budget.committed:
    name: Committed
    meaning: Money already spent against this budget in the period, including spend of its Subdivision sub-budgets.
    unit: Money in the budget's currency. Stored as micro-units, shown with two decimals.
    source: gateway
    source_detail: Written by the gateway when a request is settled, on top of the seeded opening value.
    worked_example:
      description: The Research Agent project budget.
      result: 14,000.00 USD
    allowed_range: 0 or more.
    validation: Never negative (database check).
    prd_ref: FR-05 (settle), FR-04, UX-8

  budget.reserved:
    name: Reserved
    meaning: Money held for requests that are in flight and not yet settled. It is not spent, and it is released if the request costs less.
    unit: Money in the budget's currency. Stored as micro-units, shown with two decimals.
    source: gateway
    source_detail: Written by the gateway when a request is reserved, and released when it settles. The seeded opening value stands for long-running requests.
    worked_example:
      description: The Research Agent project budget.
      result: 1,750.00 USD
    allowed_range: 0 or more.
    validation: Never negative (database check).
    prd_ref: FR-05 (reserve), UX-8 (reserved is not spent)

  budget.usage:
    name: Usage
    meaning: How much of the cap is committed and how much is reserved. Marks show 50, 80, 90 and 100% of the cap.
    unit: Percentage of the cap, two decimals, rounded down. The bar itself is drawn in whole percent.
    source: calculated
    source_detail: Calculated from cap, committed and reserved.
    formula: |
      committed_pct = committed / cap x 100
      reserved_pct  = reserved / cap x 100
      remaining_pct = 100 - committed_pct - reserved_pct  (0 when over the cap)
    formula_fn: budget_usage
    worked_example:
      description: The Research Agent project budget.
      inputs:
        cap: 35,000.00 USD
        committed: 14,000.00 USD
        reserved: 1,750.00 USD
      result: Committed 40.00%, reserved 5.00%, remaining 55.00%
    allowed_range: 0% upward. More than 100% in total means the budget is over its cap.
    validation: A cap of 0 shows 0%.
    prd_ref: UX-8 (budget bar), FR-04 (threshold examples)

  budget.remaining:
    name: Remaining
    meaning: What is left of this budget's own cap. It does not take parent budgets into account.
    unit: Money in the budget's currency, two decimals.
    source: calculated
    source_detail: Calculated from cap, committed and reserved.
    formula: |
      remaining = cap - committed - reserved
    formula_fn: budget_remaining
    worked_example:
      description: The Research Agent project budget.
      inputs:
        cap: 35,000.00 USD
        committed: 14,000.00 USD
        reserved: 1,750.00 USD
      result: 19,250.00 USD
    allowed_range: Any amount. Below zero it is shown as "Over cap by" the amount.
    validation: Calculated only.
    prd_ref: FR-04 (remaining budget)

  budget.enforcing:
    name: Limits spend
    meaning: Whether this budget can stop spend. Only Hard limit and Approval budgets do.
    unit: Yes or No.
    source: calculated
    source_detail: Calculated from the budget's policy.
    formula: |
      limits_spend = Yes when policy is Hard limit or Approval, otherwise No
    formula_fn: budget_enforcing
    worked_example:
      description: The Research Agent project budget.
      inputs:
        policy: Approval
      result: "Yes"
    allowed_range: Yes or No.
    validation: Calculated only.
    prd_ref: FR-04 (monitor and soft-limit budgets never block)

  budget.effective_remaining:
    name: Effective remaining
    meaning: What can still be spent here once parent limits are applied. It is the lowest remaining amount among this budget and the parents that limit it.
    unit: Money in the budget's currency, two decimals. "No enforced limit" when no budget on the path limits spend.
    source: calculated
    source_detail: Calculated from this budget and its parents. The gateway uses the same function.
    formula: |
      path = this budget, then each parent while the budget below it is a Subdivision
      remaining(x) = cap(x) - committed(x) - reserved(x)
      effective_remaining = min over x in path, where x limits spend, of remaining(x)
    formula_fn: budget_effective_remaining
    worked_example:
      description: The Research Agent project in the demo data. It has 19,250.00 USD of its own cap left, but the Engineering department has less, so Engineering sets the allowance. Northwind Labs is a soft limit and does not count.
      inputs:
        remaining(Research Agent, Approval): 19,250.00 USD
        remaining(Agents, Approval): 18,750.00 USD
        remaining(Engineering, Hard limit): 10,550.00 USD
        remaining(Northwind Labs, Soft limit): not limiting
      result: 10,550.00 USD
    allowed_range: 0 or more, or "No enforced limit".
    validation: Calculated only. Never shown below zero.
    prd_ref: FR-04 (effective remaining allowance), UX-8 (subdivision warning)

  vendor.id:
    name: Vendor
    meaning: The canonical identifier of a model vendor.
    unit: Text, lower case.
    source: seed script
    source_detail: Registry table. Demo vendors are fictional.
    worked_example:
      description: The blocked vendor in the demo data.
      result: vendor-b
    allowed_range: Registered vendors only.
    validation: Unique per tenant.
    prd_ref: FR-18 (canonical registry)

  vendor.status:
    name: Status
    meaning: Whether requests to this vendor are allowed. A blocked vendor blocks all of its models.
    unit: Text. Allowed or Blocked.
    source: user input
    source_detail: Set by an administrator. Demo values come from the seed script.
    worked_example:
      description: vendor-b in the demo data.
      result: Blocked
    allowed_range: ALLOWED or BLOCKED. There is no third state.
    validation: Any other value is rejected by the database.
    prd_ref: FR-18 (vendor block overrides model allow), UX-3

  registry.switch:
    name: Allowed switch
    meaning: Switching it off adds a block after you give a reason. Switching a block off again needs two administrators and is not available until phase 5.
    unit: On (allowed) or off (blocked).
    source: user input
    source_detail: Administrator action in this screen.
    worked_example:
      description: The switch for vendor-b/model-1 in the demo data. It is locked because vendor-b is blocked.
      result: Off, locked
    allowed_range: On to off only in phase 1.
    validation: A reason of 10 to 300 characters is required to block. A model under a blocked vendor cannot be switched.
    prd_ref: FR-18 (emergency block one step, lift needs two administrators), UX-3, SD-03 (pending decision)

  registry.last_change:
    name: Last change
    meaning: When the status last changed, who changed it and why.
    unit: Date and time, ISO 8601, stored in UTC, shown as YYYY-MM-DD HH:MM:SS UTC. Then the actor and the reason.
    source: system
    source_detail: Recorded with every status change (table registry_changes).
    worked_example:
      description: The block on vendor-b in the demo data.
      result: "2026-01-13 09:00:00 UTC, demo-admin: Contract review in progress. Blocked until legal sign-off."
    allowed_range: Any past time.
    validation: Written by the application together with the change, in one transaction.
    prd_ref: UX-3 (who, when and why), FR-18 (registry changes are audited)

  model.id:
    name: Model
    meaning: The canonical identifier of a model. Every alias resolves to exactly one of these.
    unit: Text, lower case, vendor/model.
    source: seed script
    source_detail: Registry table. Demo models are fictional.
    worked_example:
      description: A model of the blocked vendor in the demo data.
      result: vendor-b/model-1
    allowed_range: Registered models only. An unregistered name is denied.
    validation: Lower case with no surrounding spaces (database check).
    prd_ref: FR-18 (canonical registry, default deny)

  model.vendor:
    name: Vendor
    meaning: The vendor this model belongs to. The vendor's status applies to the model.
    unit: Text, lower case.
    source: seed script
    source_detail: Registry table.
    worked_example:
      description: The vendor of vendor-b/model-1.
      result: vendor-b
    allowed_range: A registered vendor.
    validation: Must exist in the vendor table (foreign key).
    prd_ref: FR-18

  model.aliases:
    name: Aliases
    meaning: Other names that resolve to this model. A block on the model or its vendor applies to every alias.
    unit: Text, lower case.
    source: seed script
    source_detail: Alias table.
    worked_example:
      description: The alias of vendor-b/model-1 in the demo data.
      result: vb-large
    allowed_range: Each alias points to exactly one model.
    validation: Lower case with no surrounding spaces. Unique per tenant.
    prd_ref: FR-18 (alias resolution)

  model.effective_status:
    name: Status
    meaning: Whether requests for this model are allowed right now, after the vendor's status is applied. A model is never shown as Allowed while its vendor is blocked.
    unit: Text. Allowed, Blocked, or Blocked by vendor.
    source: calculated
    source_detail: Calculated from the vendor's status and the model's own setting.
    formula: |
      status = Blocked by vendor  when vendor_status is BLOCKED
      status = Blocked            when model_status is BLOCKED
      status = Allowed            when both are ALLOWED
    formula_fn: model_effective_status
    worked_example:
      description: vendor-b/model-1 in the demo data. Its own setting is allowed, but vendor-b is blocked.
      inputs:
        model: vendor-b/model-1
        vendor_status: BLOCKED
        model_status: ALLOWED
      result: Blocked by vendor vendor-b
    allowed_range: Exactly one of the three.
    validation: Calculated only.
    prd_ref: FR-18 (vendor block overrides model allow), UX-3 (block cascade), SEC-05

  model.input_price:
    name: Input price
    meaning: The price of 1,000 input tokens, used to estimate a request's cost before it is sent.
    unit: Money per 1,000 tokens. Stored as micro-units, shown with up to six decimals.
    source: seed script
    source_detail: Registry table. Demo prices are invented.
    worked_example:
      description: vendor-b/model-1 in the demo data (2,500 micro-units).
      result: 0.0025 USD
    allowed_range: 0 or more.
    validation: Whole micro-units, never negative.
    prd_ref: FR-05 (estimate), v1.4 Section 2.5 (models table)

  model.output_price:
    name: Output price
    meaning: The price of 1,000 output tokens, used to estimate a request's cost before it is sent.
    unit: Money per 1,000 tokens. Stored as micro-units, shown with up to six decimals.
    source: seed script
    source_detail: Registry table. Demo prices are invented.
    worked_example:
      description: vendor-b/model-1 in the demo data (10,000 micro-units).
      result: 0.01 USD
    allowed_range: 0 or more.
    validation: Whole micro-units, never negative.
    prd_ref: FR-05 (estimate), v1.4 Section 2.5 (models table)

  model.max_output_tokens:
    name: Max output tokens
    meaning: The most tokens the model can return in one response. It caps the cost estimate for a request.
    unit: Whole number of tokens.
    source: seed script
    source_detail: Registry table.
    worked_example:
      description: vendor-b/model-1 in the demo data.
      result: "8,192"
    allowed_range: 1 or more.
    validation: Must be greater than zero (database check).
    prd_ref: FR-05 (estimate upper bound)

  unregistered.name:
    name: Requested name
    meaning: A model name that was requested but that nobody has registered. Requests for it are denied.
    unit: Text, as normalized (lower case, trimmed).
    source: gateway
    source_detail: Recorded by the gateway when it denies an unknown model. The first demo row comes from the seed script.
    worked_example:
      description: The unregistered model in the demo data.
      result: vendor-a/model-9
    allowed_range: Names with no registry entry and no alias.
    validation: Shown escaped. It never becomes a registry entry by itself.
    prd_ref: UX-4 (blocked, denied and unregistered), FR-18 (default deny), D-03 (pending decision)

  unregistered.seen_count:
    name: Requests
    meaning: How many requests asked for this name.
    unit: Whole number.
    source: gateway
    source_detail: Counted by the gateway. The opening demo value comes from the seed script.
    worked_example:
      description: vendor-a/model-9 in the demo data.
      result: "14"
    allowed_range: 1 or more.
    validation: Must be greater than zero (database check).
    prd_ref: UX-4, D-03

  unregistered.first_seen_at:
    name: First seen
    meaning: When this name was first requested.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: Recorded by the gateway. The opening demo value comes from the seed script.
    worked_example:
      description: vendor-a/model-9 in the demo data.
      result: "2026-01-12 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: UX-4, D-03

  unregistered.last_seen_at:
    name: Last seen
    meaning: When this name was most recently requested.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: Recorded by the gateway. The opening demo value comes from the seed script.
    worked_example:
      description: vendor-a/model-9 in the demo data.
      result: "2026-01-15 08:00:00 UTC"
    allowed_range: Any past time, not before First seen.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: UX-4, D-03

  unregistered.register:
    name: Action
    meaning: Registers the name as a model so that it can be allowed or blocked. This action is not built yet.
    unit: Button.
    source: user input
    source_detail: Administrator action in this screen.
    worked_example:
      description: The action for vendor-a/model-9 in the demo data.
      result: Register model (disabled, not built yet)
    allowed_range: One registration per name.
    validation: Disabled. Models are added through the seed data for now.
    prd_ref: UX-4 (Unregistered offers "Register model")

  block.impact:
    name: Models that will be denied
    meaning: Every model that requests will be refused for once this block is added.
    unit: List of canonical model identifiers.
    source: calculated
    source_detail: Calculated from the registry. Blocking a vendor lists all of its models.
    formula: |
      blocking a vendor: affected = every model whose vendor is that vendor
      blocking a model:  affected = that model
    formula_fn: block_impact
    worked_example:
      description: Blocking vendor-a in the demo data.
      inputs:
        subject: vendor vendor-a
      result: vendor-a/model-1, vendor-a/model-2, vendor-a/model-3
    allowed_range: Zero or more registered models.
    validation: Calculated only.
    prd_ref: FR-18 (vendor block denies every model of that vendor), UX-7 (impact preview)

  block.reason:
    name: Reason
    meaning: Why the block is being added. It is stored with the change and shown as the last change.
    unit: Text, 10 to 300 characters.
    source: user input
    source_detail: Typed by the administrator who adds the block.
    worked_example:
      description: The reason recorded for the vendor-b block in the demo data.
      result: Contract review in progress. Blocked until legal sign-off.
    allowed_range: 10 to 300 characters after trimming.
    validation: Required. Shorter or longer text is refused and nothing is changed.
    prd_ref: FR-18 (every registry change is recorded with a reason), UX-3

  gateway.requests_24h:
    name: Requests
    meaning: How many requests reached the gateway with a valid credential in the last 24 hours.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the gateway's decision records.
    formula: |
      requests = number of decision records with occurred_at later than now - 24 hours
    formula_fn: gateway_requests
    worked_example:
      description: The seeded demo data has no gateway traffic yet. After the scripted demo traffic it shows 500.
      inputs:
        decision_records_in_window: "0"
      result: "0"
    allowed_range: 0 or more.
    validation: Calculated only. Requests with a missing or wrong token are counted in metrics, not here.
    prd_ref: UX-5 (denials feed), FR-05

  gateway.refused_24h:
    name: Denied
    meaning: How many of those requests the gateway refused.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the gateway's decision records.
    formula: |
      denied = number of decision records in the last 24 hours with outcome DENIED
    formula_fn: gateway_refused
    worked_example:
      description: The seeded demo data has no gateway traffic yet.
      inputs:
        denied_records_in_window: "0"
      result: "0"
    allowed_range: 0 up to Requests.
    validation: Calculated only.
    prd_ref: UX-5, SEC-11 (denial contract)

  gateway.held_24h:
    name: Held
    meaning: How many requests are waiting for an approver because their project's budget has the Approval policy. Nothing is sent to a vendor while a request is held.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the gateway's decision records.
    formula: |
      held = number of decision records in the last 24 hours with outcome HELD
    formula_fn: gateway_held
    worked_example:
      description: The seeded demo data has no gateway traffic yet.
      inputs:
        held_records_in_window: "0"
      result: "0"
    allowed_range: 0 up to Requests. At most 20 open holds per credential.
    validation: Calculated only.
    prd_ref: FR-11 (HELD queue), FR-05 (approval policy), D-07

  gateway.last_request_at:
    name: Last request
    meaning: When the gateway last decided a request. It shows that traffic is arriving, so that zero denials is not mistaken for a gateway nobody uses.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: The newest decision record of any outcome.
    worked_example:
      description: The seeded demo data has no gateway traffic yet.
      result: never
    allowed_range: Any past time, or never.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: UX-10 (no denials state shows the last gateway request)

  denial.reason:
    name: Reason
    meaning: Why the request was refused or held, in plain words, with the stable reason code next to it. Agents receive only the code.
    unit: Text, then the code in upper case.
    source: gateway
    source_detail: Set by the gateway step that refused the request.
    worked_example:
      description: A request for a model of blocked vendor-b.
      result: The vendor is blocked VENDOR_BLOCKED
    allowed_range: Only codes registered in the gateway.
    validation: The plain-language text is looked up from the code. It is never taken from the request.
    prd_ref: UX-5 (reason in plain language, code in monospace), SEC-11, UX-D3

  denial.count_24h:
    name: Requests
    meaning: How many requests were refused or held for this reason in the last 24 hours.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the gateway's decision records.
    formula: |
      requests(reason) = number of denied or held decision records in the last 24 hours with that reason code
    formula_fn: denial_count
    worked_example:
      description: The seeded demo data has no gateway traffic yet, so there is no refusal for VENDOR_BLOCKED.
      inputs:
        reason: VENDOR_BLOCKED
      result: "0"
    allowed_range: 1 or more for a listed reason.
    validation: Calculated only. A reason with no refusals is not listed.
    prd_ref: UX-5 (grouped by reason)

  denial.trend:
    name: Last 24 hours
    meaning: How the refusals for this reason are spread over the last 24 hours, one point per hour, oldest on the left.
    unit: Requests per hour. The line is scaled to the busiest hour, which is given in words next to it.
    source: calculated
    source_detail: Counted from the gateway's decision records.
    formula: |
      point(h) = number of refusals with this reason whose age is h hours, for h = 23 down to 0
    formula_fn: denial_trend
    worked_example:
      description: The seeded demo data has no gateway traffic yet, so every hour is 0.
      inputs:
        reason: VENDOR_BLOCKED
      result: at most 0 in one hour
    allowed_range: 0 or more per hour.
    validation: Calculated only.
    prd_ref: UX-5 (sparkline per reason), UX-14 (every chart has a text summary)

  denial.time:
    name: Time
    meaning: When the gateway refused or held the request.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: Set from the gateway's clock when the decision is recorded.
    worked_example:
      description: A refusal recorded at the demo clock time would show this value.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: UX-5

  denial.agent:
    name: Agent
    meaning: The agent whose credential made the request, with its project underneath. It comes from the credential, never from anything the request says about itself.
    unit: Text.
    source: gateway
    source_detail: Derived from the gateway credential.
    worked_example:
      description: The agent of the Research Agent project in the demo data.
      result: research-agent (Research Agent)
    allowed_range: Agents registered in KeepAir.
    validation: Client headers such as X-Project are ignored.
    prd_ref: UX-5, FR-05 (principal from the credential), FR-06

  denial.model:
    name: Requested model
    meaning: The model name exactly as the request asked for it. It can be an alias or a name nobody registered.
    unit: Text, at most 200 characters.
    source: gateway
    source_detail: Copied from the request body.
    worked_example:
      description: A request that used an alias of a vendor-b model.
      result: vb-large
    allowed_range: Any text.
    validation: Untrusted input. Shown escaped and never used for policy before it is resolved in the registry.
    prd_ref: UX-5, SEC-27 (output encoding), FR-18

  denial.budget:
    name: Budget
    meaning: The budget that stopped or holds the request. Empty when the refusal had nothing to do with a budget.
    unit: Text. The budget's scope name.
    source: gateway
    source_detail: Recorded by the ledger when it refuses or holds a reservation.
    worked_example:
      description: A request refused because the Summaries EU project budget had no room.
      result: Summaries EU
    allowed_range: A budget on the project's limit path, or empty.
    validation: Shown in this screen only. The agent's error response never names a budget or an amount.
    prd_ref: UX-5, SEC-11 (no budget amounts or internal identifiers in the response)

  denial.request_id:
    name: Request ID
    meaning: The identifier the gateway gave the request. The agent received the same ID, so a report from a developer can be matched to this row.
    unit: UUID version 7.
    source: gateway
    source_detail: Generated by the gateway for every request and returned in the X-KeepAir-Request-Id header.
    worked_example:
      description: The shape of a request ID.
      result: 019bc0f7-7480-7xxx-xxxx-xxxxxxxxxxxx
    allowed_range: One per request.
    validation: Generated by the gateway. It cannot be supplied by the client.
    prd_ref: UX-5, SEC-11 (request ID in every denial)

  credential.agent:
    name: Agent
    meaning: The agent this credential belongs to, with its project underneath. Spend made with the credential is charged to that project's budget.
    unit: Text.
    source: seed script
    source_detail: Agents come from the demo seed. Each project has one.
    worked_example:
      description: The agent of the Research Agent project in the demo data.
      result: research-agent (Research Agent)
    allowed_range: Agents of this tenant.
    validation: Must exist (foreign key).
    prd_ref: FR-05 (authenticate), FR-17 (each agent has its own credential)

  credential.label:
    name: Label
    meaning: A short name that tells credentials of the same agent apart.
    unit: Text, 1 to 60 characters.
    source: user input
    source_detail: Typed when the credential is created. Demo credentials are labelled demo.
    worked_example:
      description: The label of the seeded demo credentials.
      result: demo
    allowed_range: 1 to 60 characters.
    validation: Required. Shown escaped.
    prd_ref: FR-05 (credentials), SEC-27

  credential.status:
    name: Status
    meaning: Whether the gateway accepts this credential right now.
    unit: Text. Active, Expired or Revoked.
    source: calculated
    source_detail: Calculated from the revocation time and the expiry time, judged by the database clock.
    formula: |
      status = Revoked  when revoked_at is set
      status = Expired  when expires_at <= now
      status = Active   otherwise
    formula_fn: credential_status
    worked_example:
      description: The demo credential of the Research Agent project. It was issued when the demo data was loaded and is valid for 90 days.
      inputs:
        agent: research-agent
        revoked_at: none
        expires_at: 90 days after it was issued
      result: Active
    allowed_range: Exactly one of the three.
    validation: Calculated only. A revoked or expired credential is refused at the next request.
    prd_ref: SEC-12 (90-day maximum, revocation), SD-02 (pending decision)

  credential.created_at:
    name: Created
    meaning: When the credential was created.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Set from the database clock when the credential is created.
    worked_example:
      description: A credential created at the demo clock time would show this value.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Set by the database. It cannot be entered.
    prd_ref: SEC-12

  credential.expires_at:
    name: Expires
    meaning: When the credential stops working. It is 90 days after creation.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Set from the database clock when the credential is created.
    worked_example:
      description: A credential created at the demo clock time would expire at this value.
      result: "2026-04-15 09:00:00 UTC"
    allowed_range: At most 90 days after Created.
    validation: The database refuses a lifetime longer than 90 days.
    prd_ref: SEC-12 (90-day maximum), SD-02 (pending decision)

  credential.revoke:
    name: Revoke
    meaning: Stops the credential at once. The agent's next request is refused, and this cannot be undone.
    unit: Button.
    source: user input
    source_detail: Administrator action in this screen.
    worked_example:
      description: The action for an active demo credential.
      result: Revoke
    allowed_range: Active credentials only.
    validation: One step. Revoking only narrows access.
    prd_ref: SEC-12 (revocation), FR-05 (rotation creates a new token and revokes the old one)

  credential.new_agent:
    name: Agent
    meaning: The agent the new credential is for.
    unit: Choice from the list of agents.
    source: user input
    source_detail: Chosen in the form.
    worked_example:
      description: Creating a credential for the Research Agent project's agent.
      result: research-agent (Research Agent)
    allowed_range: Agents of this tenant.
    validation: Required. An unknown agent is refused.
    prd_ref: FR-05 (credentials), FR-17

  credential.token:
    name: Token
    meaning: The secret the agent sends to the gateway. It is shown once, here, and cannot be shown again.
    unit: Text. kair_, then 43 characters, then a 6-character checksum.
    source: system
    source_detail: Generated from 256 random bits when the credential is created. Only its SHA-256 hash is stored.
    worked_example:
      description: The shape of a token. This is not a working token.
      result: kair_<43 characters>_<6 characters>
    allowed_range: 256 bits of randomness.
    validation: A token with a wrong checksum is refused before any database lookup.
    prd_ref: SEC-12 (256-bit, hashed), SEC-22 (prefix and checksum), FR-05

  failopen.banner:
    name: Fail-open banner
    meaning: Tells everyone that requests were sent without a budget check because the ledger could not be reached. It stays until the ledger is back, the spool is written to the ledger, and someone acknowledges it.
    unit: Count of requests, and times as YYYY-MM-DD HH:MM:SS UTC.
    source: calculated
    source_detail: While it is active the count comes from the gateway's spool. Afterwards it is the number of recorded fail-open events nobody has acknowledged.
    formula: |
      shown = gateway reports the ledger unreachable
              or requests wait in the spool
              or unacknowledged fail-open events exist
      count = requests waiting in the spool + unacknowledged events
    formula_fn: fail_open_banner
    worked_example:
      description: The seeded demo data. The ledger was never down, so the banner is not shown.
      inputs:
        ledger_unreachable: "no"
        waiting_in_spool: "0"
        unacknowledged_events: "0"
      result: not shown, count 0
    allowed_range: Shown or not shown.
    validation: It cannot be dismissed while fail-open is active or the spool is not yet replayed.
    prd_ref: UX-7 (fail-open banner), SEC-06, SD-04 (pending decision)

  failopen.state:
    name: Fail-open
    meaning: Whether the gateway is sending requests without a budget check right now. Unknown means the gateway did not answer, which is not the same as not active.
    unit: Text. Active, Not active or Unknown.
    source: gateway
    source_detail: Asked from the gateway directly, so it is known even when this screen cannot read the database.
    worked_example:
      description: The seeded demo data, with the gateway running and the ledger reachable.
      result: Not active
    allowed_range: Exactly one of the three.
    validation: Reported by the gateway. It cannot be set here.
    prd_ref: UX-7, FR-21 (failure visibility), UX-6 (Unknown is never shown as healthy)

  failopen.waiting:
    name: Waiting in the spool
    meaning: Requests that were sent without a budget check and are not yet written to the ledger. They are written when the ledger is back.
    unit: Whole number.
    source: gateway
    source_detail: Counted by the gateway from its encrypted spool.
    worked_example:
      description: The seeded demo data. Nothing was spooled.
      result: "0"
    allowed_range: 0 up to the spool's limit of 10,000 records, 100 MB or one hour.
    validation: When a limit is reached, further requests are refused.
    prd_ref: SEC-06 (encrypted spool, capped), SD-04 (pending decision)

  failopen.events:
    name: Recorded
    meaning: How many requests were sent without a budget check and have since been written to the ledger.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the fail-open event records.
    formula: |
      recorded = number of fail-open event records
    formula_fn: fail_open_events
    worked_example:
      description: The seeded demo data. The ledger was never down.
      inputs:
        fail_open_event_records: "0"
      result: "0"
    allowed_range: 0 or more.
    validation: Calculated only. Each spooled request becomes exactly one record, however often the spool is replayed.
    prd_ref: FR-12 (fail-open activity report), FR-05 (every fail-open request is counted)

  failopen.unacknowledged:
    name: Not acknowledged
    meaning: How many of the recorded requests nobody has acknowledged yet. The banner stays while this is above zero.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the fail-open event records.
    formula: |
      not_acknowledged = number of fail-open event records with no acknowledgement time
    formula_fn: fail_open_unacknowledged
    worked_example:
      description: The seeded demo data. The ledger was never down.
      inputs:
        records_without_acknowledgement: "0"
      result: "0"
    allowed_range: 0 up to Recorded.
    validation: Calculated only.
    prd_ref: UX-7 (cannot be dismissed until acknowledged), FR-12

  failopen.time:
    name: Time
    meaning: When the request was sent.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: The gateway's clock when it wrote the spool record, before sending.
    worked_example:
      description: A request spooled at the demo clock time would show this value.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: FR-12 (fail-open report)

  failopen.agent:
    name: Agent
    meaning: The agent whose credential made the request, with its project underneath.
    unit: Text.
    source: gateway
    source_detail: Derived from the gateway credential and kept in the spool record.
    worked_example:
      description: The agent of the Ticket Triage project, whose budgets are all soft.
      result: ticket-triage-agent (Ticket Triage)
    allowed_range: Agents whose whole budget path is monitor or soft.
    validation: An agent with a hard-limit or approval budget on its path never appears here.
    prd_ref: FR-12, FR-05 (principal from the credential)

  failopen.budget:
    name: Budget
    meaning: The project budget the request was charged to after the ledger came back.
    unit: Text. The budget's scope name.
    source: gateway
    source_detail: Kept in the spool record and applied at replay to every budget on its limit path.
    worked_example:
      description: A request from the Ticket Triage agent.
      result: Ticket Triage
    allowed_range: Monitor and soft budgets only.
    validation: Hard-limit and approval budgets fail closed and never appear here.
    prd_ref: FR-12 (fail-open report lists the budget), SEC-06

  failopen.model:
    name: Model
    meaning: The canonical model the request was sent to. Blocks were applied before sending, so it is always an allowed model.
    unit: Text, lower case, vendor/model.
    source: gateway
    source_detail: Resolved in the registry before the request was sent.
    worked_example:
      description: A request that asked for the alias model-1.
      result: vendor-a/model-1
    allowed_range: Allowed models of allowed vendors.
    validation: A blocked or unregistered model is refused whether the ledger is up or down.
    prd_ref: FR-18 (blocks never fail open), FR-12

  failopen.amount:
    name: Amount
    meaning: What the request cost, charged to the budget when the ledger came back.
    unit: Money in the budget's currency. Stored as micro-units. Shown with two decimals, or with up to six when it is below one cent.
    source: gateway
    source_detail: From the vendor's usage figures. If the vendor gave none, the estimate made before sending.
    worked_example:
      description: A small request of about 60 output tokens costs well under one cent (885 micro-units).
      result: 0.000885 USD
    allowed_range: 0 or more.
    validation: Whole micro-units, never negative.
    prd_ref: FR-12, FR-05 (settle), FR-02

  failopen.usage:
    name: Usage
    meaning: Whether the amount is the vendor's reported usage or only the estimate made before sending.
    unit: Text.
    source: gateway
    source_detail: Recorded by the gateway after the vendor answered, or left unknown if no answer was recorded.
    worked_example:
      description: A request the vendor answered normally.
      result: Reported by the vendor
    allowed_range: Reported by the vendor, or Unknown.
    validation: Unknown usage is charged at the estimate, which is an upper bound.
    prd_ref: FR-05 (usage_known), FR-12

  failopen.replayed_at:
    name: Written to ledger
    meaning: When the spooled record was written to the ledger and charged to the budget.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: Set by the gateway when it replays the spool.
    worked_example:
      description: A record replayed at the demo clock time would show this value.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Not before Time.
    validation: Each record is written once. Replaying again changes nothing.
    prd_ref: SEC-06 (replay and reconciliation), FR-12 (whether reconciled)

  failopen.acknowledged:
    name: Acknowledged
    meaning: When someone confirmed they have seen this fail-open, and who.
    unit: Date and time as YYYY-MM-DD HH:MM:SS UTC, then the actor. "Not yet" until acknowledged.
    source: user input
    source_detail: Set by the Acknowledge button on the banner.
    worked_example:
      description: A record acknowledged from this screen before sign-in exists.
      result: "2026-01-15 09:00:00 UTC, demo-operator"
    allowed_range: Any time after the record was written to the ledger.
    validation: Not possible while fail-open is active or the spool is not yet replayed.
    prd_ref: UX-7 (acknowledgement), FR-12 (fail_events.acknowledged_at)

  console.ledger_state:
    name: Ledger, as the gateway sees it
    meaning: Whether the gateway can write to the ledger. Stopping it here is a simulation for the demo, not a real outage.
    unit: Text. Running, Stopped or Unknown.
    source: gateway
    source_detail: Asked from the gateway directly.
    worked_example:
      description: The seeded demo data with the gateway running.
      result: Running
    allowed_range: Exactly one of the three.
    validation: The switch exists in demo mode only. The gateway does not offer it in production.
    prd_ref: SEC-06 (failure policy), SEC-23 (test material refused in production)

  console.agent:
    name: Agent
    meaning: The demo agent that sent the test request, with its project underneath.
    unit: Text.
    source: seed script
    source_detail: Fixed list of eight test requests in the application.
    worked_example:
      description: The first test request.
      result: ticket-triage-agent (Ticket Triage)
    allowed_range: Demo agents.
    validation: Fixed. It cannot be edited.
    prd_ref: FR-05, hard rule 2 of the owner brief (demo data)

  console.limit_kind:
    name: Budgets on its path
    meaning: Whether any budget that limits this project can stop spend. Only projects with monitor and soft budgets alone may continue during a ledger outage.
    unit: Text.
    source: calculated
    source_detail: Calculated from the policies of the budgets on the project's limit path.
    formula: |
      "Hard limit or approval on its path"  when any budget on the limit path is Hard limit or Approval
      "Monitor and soft only"               otherwise
    formula_fn: console_limit_kind
    worked_example:
      description: The Ticket Triage project. Its own, team, department and organization budgets are all soft limits.
      inputs:
        project: Ticket Triage
        policies_on_path: Soft limit, Soft limit, Soft limit, Soft limit
      result: Monitor and soft only
    allowed_range: One of the two.
    validation: Calculated only.
    prd_ref: FR-05 (policy modes and fail behavior), SEC-06, FR-04

  console.model:
    name: Requested model
    meaning: The model name the test request asked for. Some are blocked or unregistered on purpose.
    unit: Text.
    source: seed script
    source_detail: Fixed list of eight test requests in the application.
    worked_example:
      description: The sixth test request asks for an alias of a blocked vendor's model.
      result: vb-large
    allowed_range: Fixed list.
    validation: Fixed. It cannot be edited.
    prd_ref: FR-18, UX-4

  console.outcome:
    name: Outcome
    meaning: What the gateway did with the test request, in plain words, with the code the agent received.
    unit: Text, then the code in upper case.
    source: gateway
    source_detail: The gateway's answer to the test request.
    worked_example:
      description: A soft-budget request while the ledger is stopped.
      result: Sent. Sent without a budget check while the ledger was down FAIL_OPEN
    allowed_range: Only codes registered in the gateway.
    validation: The words are looked up from the code.
    prd_ref: SEC-11 (stable reason codes), SEC-06, UX-5

  spend.period:
    name: Billing period
    meaning: The calendar month the figures on this page belong to.
    unit: Year and month, ISO 8601 (YYYY-MM). Months start and end at midnight UTC.
    source: system
    source_detail: Chosen from the months that have gateway usage or billing records. By default the newest month with billing data.
    worked_example:
      description: The month covered by the demo data.
      result: 2026-01
    allowed_range: A month that has data.
    validation: Any other value falls back to the default month.
    prd_ref: FR-07 (reconcile per billing period), UX-8 (timezone labelled)

  cost.estimated:
    name: Estimated
    meaning: What the gateway calculated for the requests it handled, from its own price list. It is an estimate, not a charge.
    unit: USD, the price list's currency. Stored as micro-units, shown with two decimals.
    source: calculated
    source_detail: Summed from the gateway's usage records in the period.
    formula: |
      estimated = sum of price_micros over gateway usage records
                  with occurred_at inside the billing period
    formula_fn: cost_estimated
    worked_example:
      description: The demo data for January 2026.
      inputs:
        period: 2026-01
        records_from: gateway usage records
      result: 182,373.32 USD
    allowed_range: 0 or more.
    validation: Always carries the state Estimated. It can never be shown as Provider-reported or Invoiced.
    prd_ref: FR-07 (finalization state), FR-06 (separate estimated from invoiced), UX-8

  cost.provider_reported:
    name: Provider-reported
    meaning: What the provider's usage export says was used. It is the provider's figure, not yet an invoice.
    unit: USD. Stored as micro-units, shown with two decimals.
    source: calculated
    source_detail: Summed from the current revision of each record in the loaded usage export.
    formula: |
      provider_reported = sum of billed cost over current billing records
                          with state PROVIDER_REPORTED in the billing period
    formula_fn: cost_provider_reported
    worked_example:
      description: The demo data after loading demo/billing/vendor-a-usage-2026-01.csv.
      inputs:
        period: 2026-01
        records_from: vendor-a usage export
      result: 182,423.21 USD
    allowed_range: 0 or more. "No data" until a usage export is loaded.
    validation: Only the usage export source may supply this state. Superseded revisions are not counted.
    prd_ref: FR-07 (finalization state), FR-01 (idempotent ingestion), UX-8

  cost.invoiced:
    name: Invoiced
    meaning: What an invoice says is owed. This is the final figure for the records it covers.
    unit: USD. Stored as micro-units, shown with two decimals.
    source: calculated
    source_detail: Summed from the current revision of each record in the loaded invoice file.
    formula: |
      invoiced = sum of billed cost over current billing records
                 with state INVOICED in the billing period
    formula_fn: cost_invoiced
    worked_example:
      description: The demo data after loading demo/billing/vendor-a-invoice-2026-01.csv, which covers 1 to 7 January.
      inputs:
        period: 2026-01
        records_from: vendor-a invoice
      result: 92,457.80 USD
    allowed_range: 0 or more. "No data" until an invoice file is loaded.
    validation: Only the invoice source may supply this state. An estimate can never appear here.
    prd_ref: FR-07 (never present estimates as finalized invoices), D-05 (pending decision), UX-8

  cost.model_chart:
    name: Cost by model
    meaning: Daily cost of one model, with a bar per finalization state. All model charts share one scale, so their heights can be compared.
    unit: USD per day (UTC). Bar height is the day's amount divided by the scale's top.
    source: calculated
    source_detail: Gateway usage records and current billing records, grouped by model and day.
    formula: |
      bar_height(model, day, state) = amount(model, day, state) / scale_top
      scale_top = the largest daily amount of any model and state in the period
    formula_fn: cost_model_chart
    worked_example:
      description: The chart of vendor-a/model-1 in the demo data, after the usage export and the invoice are loaded.
      inputs:
        model: vendor-a/model-1
        scale_top: 9,803.49 USD
      result: 2026-01-01 to 2026-01-14. Estimated 117,193.46 USD, Provider-reported 117,223.51 USD, Invoiced 57,240.61 USD.
    allowed_range: 0 or more per day.
    validation: The three states are drawn side by side and never stacked or added. The text under the chart and its table give the exact figures.
    prd_ref: UX-8 (small multiples for cost by model, hatched estimates), UX-14 (text summary and table view)

  cost.day:
    name: Day
    meaning: The day the usage happened, in UTC.
    unit: Date, ISO 8601 (YYYY-MM-DD), UTC.
    source: system
    source_detail: From the gateway's record time, or the charge period of the billing record.
    worked_example:
      description: The first day in the demo data.
      result: "2026-01-01"
    allowed_range: A day inside the billing period.
    validation: Billing records must carry a timezone; they are converted to UTC.
    prd_ref: UX-8 (timezone shown on every axis), ISO 8601

  alloc.project:
    name: Project
    meaning: The project the cost belongs to, with its team underneath.
    unit: Text.
    source: seed script
    source_detail: Projects of the demo organization.
    worked_example:
      description: A project that receives both direct cost and a share of shared cost.
      result: Build Assistant (Platform)
    allowed_range: Projects of this tenant.
    validation: A record is tied to a project only by its tags, by a rule, or by hand. Never by guessing.
    prd_ref: FR-03 (cost allocation), FR-06 (attribution)

  alloc.direct:
    name: Direct
    meaning: Cost whose billing record names both the team and the project in its tags.
    unit: USD, two decimals.
    source: calculated
    source_detail: Summed from the current allocation facts with confidence DIRECT.
    formula: |
      direct = sum of allocated amounts with confidence DIRECT for the project
    formula_fn: alloc_direct
    worked_example:
      description: Build Assistant in the demo data, provider-reported records.
      inputs:
        project: Build Assistant
        state: Provider-reported
      result: 21,915.33 USD
    allowed_range: 0 or more.
    validation: Join confidence is 90 to 100 for a direct match.
    prd_ref: FR-03 (direct attribution), FR-06 (exact match)

  alloc.inferred:
    name: Inferred
    meaning: Cost assigned by an allocation rule that splits shared cost, or by a match on the project name alone. Amounts matched on the name alone are marked "to review".
    unit: USD, two decimals.
    source: calculated
    source_detail: Summed from the current allocation facts with confidence INFERRED.
    formula: |
      inferred = sum of allocated amounts with confidence INFERRED for the project
      a split uses the largest-remainder method, so the parts add up to the record exactly
    formula_fn: alloc_inferred
    worked_example:
      description: Build Assistant gets 60% of the Platform team's shared cost through the rule "Platform shared cost".
      inputs:
        project: Build Assistant
        state: Provider-reported
      result: 10,755.86 USD
    allowed_range: 0 or more.
    validation: Rules apply in priority order; equal priorities are ordered by rule id, so the result is always the same.
    prd_ref: FR-03 (rule-based allocation, shared-cost splitting, inferred attribution)

  alloc.manual:
    name: Manual
    meaning: Cost that a person assigned to the project in the queue below.
    unit: USD, two decimals.
    source: calculated
    source_detail: Summed from the current allocation facts with confidence MANUAL.
    formula: |
      manual = sum of allocated amounts with confidence MANUAL for the project
    formula_fn: alloc_manual
    worked_example:
      description: Build Assistant in the demo data. Nothing has been assigned by hand yet.
      inputs:
        project: Build Assistant
        state: Provider-reported
      result: 0.00 USD
    allowed_range: 0 or more.
    validation: A manual assignment needs a reason and replaces the earlier allocation, which is kept as history.
    prd_ref: FR-03 (manually assigned attribution, auditable change history)

  alloc.total:
    name: Allocated
    meaning: All cost allocated to the project, whatever the confidence.
    unit: USD, two decimals.
    source: calculated
    source_detail: Calculated from the three confidence columns.
    formula: |
      allocated = direct + inferred + manual
    formula_fn: alloc_total
    worked_example:
      description: Build Assistant in the demo data. The sum is made in exact micro-units and then rounded, so it can differ by one cent from adding the rounded parts.
      inputs:
        project: Build Assistant
        state: Provider-reported
        direct: 21,915.33 USD
        inferred: 10,755.86 USD
        manual: 0.00 USD
      result: 32,671.20 USD
    allowed_range: 0 or more.
    validation: Allocated, unmatched and unallocated together are always 100% of the loaded records.
    prd_ref: FR-03 (allocation percentages reconcile to 100%)

  queue.record_key:
    name: Record
    meaning: The provider's identifier of the billing record, with the model underneath.
    unit: Text.
    source: provider export
    source_detail: Column x_RecordKey of the billing file.
    worked_example:
      description: The record in the demo file that names a project nobody knows.
      result: va-2026-01-14-shadow-experiment-vendor-a-model-1
    allowed_range: 1 to 120 letters, digits, dot, colon, dash or underscore.
    validation: Record key and revision together must be unique per source.
    prd_ref: FR-01 (idempotent by source, record key and revision)

  queue.tags:
    name: Tags
    meaning: The labels the billing record carries. Allocation uses team and project.
    unit: Text, as key=value pairs.
    source: provider export
    source_detail: Column Tags of the billing file.
    worked_example:
      description: The unmatched record in the demo file.
      result: project=shadow-experiment team=Growth
    allowed_range: Keys team, project, customer, application, agent, environment.
    validation: Untrusted input. Other keys are dropped when the file is loaded. Values are shown escaped.
    prd_ref: FR-06 (join keys), SEC-27 (allowlisted metadata keys)

  queue.amount:
    name: Amount
    meaning: The cost of the record, with its finalization state.
    unit: Money in the billing currency, two decimals.
    source: provider export
    source_detail: Column BilledCost of the billing file, read as an exact decimal.
    worked_example:
      description: The unmatched record in the demo file.
      result: 42.50 USD
    allowed_range: 0 or more, with at most six decimals in the file.
    validation: A cost that is negative, not a number, or has more than six decimals rejects the whole file.
    prd_ref: FR-02 (money as micro-units), FR-07 (state on every figure)

  queue.state:
    name: Why it is here
    meaning: Why the record is not simply allocated. To review means matched on the project name alone; Unmatched means its tags fit no project; Unallocated means it has no tags.
    unit: Text.
    source: calculated
    source_detail: Calculated from the record's tags and the join confidence.
    formula: |
      To review    when join_confidence is 70 to 89
      Unmatched    when the record has tags and join_confidence is below 70
      Unallocated  when the record has no tags
    formula_fn: queue_state
    worked_example:
      description: The Red Team record in the demo file that is tagged with the project only.
      inputs:
        join_confidence: "70"
      result: To review
    allowed_range: One of the three.
    validation: Calculated only. Records with confidence 90 or more do not appear in this list.
    prd_ref: FR-06 (launch confidence thresholds), FR-03 (unallocated-spend buckets)

  queue.join_confidence:
    name: Join confidence
    meaning: How sure the match between the record and a project is, from 0 to 100.
    unit: Whole number, 0 to 100.
    source: calculated
    source_detail: Calculated from which tags are present and match.
    formula: |
      team and project match   = 100 - 5 for each missing optional tag, never below 90
      project matches, no team = 70
      no match                 = 0
    formula_fn: queue_join_confidence
    worked_example:
      description: The Red Team record in the demo file carries no team tag.
      inputs:
        tags: project=Red Team
      result: "70"
    allowed_range: 0 to 100.
    validation: 90 to 100 is accepted; 70 to 89 is accepted and listed for review; below 70 is unmatched.
    prd_ref: FR-06 (confidence score and thresholds)

  queue.assign:
    name: Assign to project
    meaning: Assigns the record to a project by hand. For a record under review, confirming keeps the suggested project.
    unit: Choice from the list of projects.
    source: user input
    source_detail: Chosen in this row.
    worked_example:
      description: Assigning the shadow-experiment record to an existing project.
      result: Lead Scoring
    allowed_range: Projects of this tenant.
    validation: Required, together with a reason. The earlier allocation is kept as history.
    prd_ref: FR-03 (manual assignment, auditable change history)

  queue.reason:
    name: Reason
    meaning: Why the record belongs to that project. It is stored with the assignment.
    unit: Text, 10 to 300 characters.
    source: user input
    source_detail: Typed in this row.
    worked_example:
      description: A reason for a manual assignment.
      result: Belongs to the growth pilot, confirmed by its owner.
    allowed_range: 10 to 300 characters after trimming.
    validation: Required. Shorter or longer text is refused and nothing is changed.
    prd_ref: FR-03 (users can inspect the rule, source and confidence behind an amount)

  upload.source:
    name: Source
    meaning: Which kind of file this is. Each source may supply one finalization state only.
    unit: Choice. vendor-a usage export (Provider-reported) or vendor-a invoice (Invoiced).
    source: user input
    source_detail: Chosen in the form.
    worked_example:
      description: The source for demo/billing/vendor-a-usage-2026-01.csv.
      result: vendor-a usage export
    allowed_range: The listed sources.
    validation: A file whose rows claim another state or another provider than the source is refused as a whole.
    prd_ref: FR-07 (finalization state), FR-01 (source-specific ingestion)

  upload.file:
    name: File
    meaning: A billing file in the FOCUS column layout.
    unit: CSV file, UTF-8, at most 5 MB and 20,000 rows.
    source: user input
    source_detail: Chosen in the form. Demo files are in demo/billing in the repository.
    worked_example:
      description: The demo usage export.
      result: vendor-a-usage-2026-01.csv (431 rows)
    allowed_range: At most 5 MB, 20,000 rows, 2,000 characters per field.
    validation: Untrusted input. The header must match exactly and every row must be valid, or nothing is loaded.
    prd_ref: FR-01 (ingestion), FR-02 (FOCUS-compatible), SEC-28 (untrusted files)

  batch.time:
    name: Loaded at
    meaning: When the file was handed in.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Set from the application clock.
    worked_example:
      description: A file loaded at the demo clock time would show this value.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Set by the application.
    prd_ref: FR-01 (source-specific ingestion status), FR-02 (ingestion timestamp)

  batch.file:
    name: File
    meaning: The name of the file as it was uploaded, with its source underneath.
    unit: Text, at most 200 characters.
    source: user input
    source_detail: The uploaded file's name. A fingerprint of its content is stored with it.
    worked_example:
      description: The demo usage export.
      result: vendor-a-usage-2026-01.csv (vendor-a usage export)
    allowed_range: Any file name.
    validation: Untrusted input, shown escaped. It is never used as a path.
    prd_ref: FR-01 (ingestion status), SEC-27

  batch.status:
    name: Result
    meaning: Loaded means every row was valid. Refused means at least one row was invalid and nothing from the file was loaded; the reasons are listed.
    unit: Text. Loaded or Refused.
    source: system
    source_detail: Set when the file is checked.
    worked_example:
      description: The result for demo/billing/broken-example.csv.
      result: Refused, with four reasons
    allowed_range: Loaded or Refused.
    validation: Reasons name the row and the column. They never repeat cell content.
    prd_ref: FR-02 (a failing batch is quarantined, not loaded), SEC-28

  batch.rows_total:
    name: Rows
    meaning: How many data rows the file had.
    unit: Whole number.
    source: system
    source_detail: Counted when the file is read.
    worked_example:
      description: The demo usage export.
      result: "431"
    allowed_range: 1 to 20,000.
    validation: Rows = New + Revised + Unchanged for a loaded file.
    prd_ref: FR-01 (ingestion status and diagnostics)

  batch.rows_new:
    name: New
    meaning: Rows whose record was not known before.
    unit: Whole number.
    source: system
    source_detail: Counted while loading.
    worked_example:
      description: The demo usage export, loaded for the first time.
      result: "431"
    allowed_range: 0 up to Rows.
    validation: Counted by record key per source.
    prd_ref: FR-01 (idempotent processing)

  batch.rows_revised:
    name: Revised
    meaning: Rows that carry a higher revision of a known record. The new revision replaces the old one in all totals; the old one is kept.
    unit: Whole number.
    source: system
    source_detail: Counted while loading.
    worked_example:
      description: demo/billing/vendor-a-usage-2026-01-correction.csv, loaded after the usage export.
      result: "2"
    allowed_range: 0 up to Rows.
    validation: A revision lower than the loaded one is refused.
    prd_ref: FR-01 (a period can be corrected without corrupting history)

  batch.rows_unchanged:
    name: Unchanged
    meaning: Rows that were loaded before with the same content. They are counted and nothing is written, so loading a file twice changes nothing.
    unit: Whole number.
    source: system
    source_detail: Counted while loading.
    worked_example:
      description: The demo usage export, loaded a second time.
      result: "431"
    allowed_range: 0 up to Rows.
    validation: The same record and revision with different content is refused, not overwritten.
    prd_ref: FR-01 (duplicate ingestion produces no duplicate records)

  recon.difference:
    name: Difference
    meaning: How far the provider's figure is from the gateway's estimate. A plus sign means the provider reports more.
    unit: USD, two decimals, with a sign.
    source: calculated
    source_detail: Calculated from the two totals of the same period.
    formula: |
      difference = provider_reported - estimated
    formula_fn: recon_difference
    worked_example:
      description: January 2026 in the demo data, after the usage export is loaded.
      inputs:
        provider_reported: 182,423.21 USD
        estimated: 182,373.32 USD
      result: +49.89 USD
    allowed_range: Any amount. "No provider data" until a usage export is loaded.
    validation: A comparison of two figures, not a sum. Each keeps its own state.
    prd_ref: FR-07 (reconciliation difference)

  recon.unattributed:
    name: Not tied to a project
    meaning: Provider-reported cost that no record's tags tie to one project. It contains shared cost split by a rule, unmatched and unallocated records.
    unit: USD, two decimals.
    source: calculated
    source_detail: Calculated from the period total and the per-project figures.
    formula: |
      not_tied = provider_reported total
                 - sum over projects of cost tied to the project by its tags or by hand
    formula_fn: recon_unattributed
    worked_example:
      description: January 2026 in the demo data. Most of it is the Platform team's shared cost.
      inputs:
        provider_reported: 182,423.21 USD
      result: 17,986.19 USD
    allowed_range: 0 or more.
    validation: Calculated only.
    prd_ref: FR-07 (unmatched spending), FR-03 (unallocated-cost reporting)

  recon.findings:
    name: Uncontrolled findings
    meaning: How many projects the provider reports clearly more usage for than the gateway recorded. That usage did not go through the gateway.
    unit: Whole number of projects.
    source: calculated
    source_detail: Calculated per project from the provider-reported and the estimated figure.
    formula: |
      a project is flagged when
      provider_reported - estimated > max(2% of provider_reported, 1.00 USD)
    formula_fn: recon_findings
    worked_example:
      description: January 2026 in the demo data.
      inputs:
        flagged_projects: Lead Scoring
      result: "1"
    allowed_range: 0 up to the number of projects.
    validation: Calculated only. The threshold is the PRD's proposed value and is to be tuned in a pilot.
    prd_ref: FR-19 (uncontrolled spend detection), UX-2 (coverage badge Uncontrolled)

  recon.share:
    name: Gateway-controlled share
    meaning: How much of the provider-reported usage of the project went through the gateway. It is never shown as 100% while egress control is not verified.
    unit: Percentage, two decimals, rounded down.
    source: calculated
    source_detail: Calculated per project from the estimated and the provider-reported figure.
    formula: |
      share = estimated / provider_reported x 100, at most 100
    formula_fn: recon_share
    worked_example:
      description: Lead Scoring in the demo data. The provider saw 30% more than the gateway.
      inputs:
        project: Lead Scoring
        estimated: 2,400.00 USD
        provider_reported: 3,120.00 USD
      result: 76.92%
    allowed_range: 0% to 100%. "No provider data" until a usage export is loaded.
    validation: A computed 100% is shown as "99% or more" because the coverage badge cannot be Enforced in the MVP.
    prd_ref: FR-19 (gateway-controlled share), UX-8 (never 100% unless Enforced), FR-05 (limitation)

  recon.finding:
    name: Finding
    meaning: Uncontrolled means the provider reports clearly more than the gateway recorded for this project. KeepAir can show this spend but could not stop it.
    unit: Text, with the amount.
    source: calculated
    source_detail: Calculated per project from the provider-reported and the estimated figure.
    formula: |
      uncontrolled = provider_reported - estimated
      shown when it is above max(2% of provider_reported, 1.00 USD)
    formula_fn: recon_finding
    worked_example:
      description: Lead Scoring in the demo data.
      inputs:
        project: Lead Scoring
        provider_reported: 3,120.00 USD
        estimated: 2,400.00 USD
      result: Uncontrolled, 720.00 USD
    allowed_range: None, or Uncontrolled with an amount.
    validation: Calculated only. Without provider data nothing can be said either way.
    prd_ref: FR-19 (UNCONTROLLED_SPEND), bypass route B-b, UX-2

  # --- Phase 5: sign-in, owners, approvals, kill switch ---------------------------
  auth.username:
    name: User name
    meaning: The name of your KeepAir account. It is not case sensitive.
    unit: Text, 3 to 40 characters.
    source: user input
    source_detail: Typed on the sign-in page.
    worked_example:
      description: An administrator in the demo data.
      result: alice.admin
    allowed_range: Lower-case letters, digits, dot, dash and underscore, starting with a letter.
    validation: An unknown name gives the same answer as a wrong password, so the page does not reveal which names exist.
    prd_ref: FR-13 (identity and access), SEC-13

  auth.password:
    name: Password
    meaning: The secret you chose or were given for this account. KeepAir stores only a salted hash of it.
    unit: Text, 12 to 128 characters. It is never shown.
    source: user input
    source_detail: Typed on the sign-in page.
    worked_example:
      description: What the input shows while typing.
      result: Dots in place of the characters
    allowed_range: 12 to 128 characters of any kind. No rule about digits or symbols.
    validation: After 5 failed attempts the account is locked for 15 minutes.
    prd_ref: FR-13 (identity and access), SEC-13 (NIST SP 800-63B password rules)

  auth.code:
    name: Authenticator code
    meaning: The 6-digit code your authenticator app shows right now. It proves that the person acting holds the second factor, at sign-in and again for every sensitive action.
    unit: 6 digits. A new code every 30 seconds.
    source: user input
    source_detail: Read from an authenticator app (time-based one-time password, RFC 6238) and typed here.
    worked_example:
      description: The form of a code. In demo mode the page shows the current one next to the input.
      result: "492 039"
    allowed_range: 6 digits. The code of the current 30-second step, or of the step before or after it.
    validation: Each code is accepted once. A wrong or reused code changes nothing and counts as a failed attempt.
    prd_ref: FR-13 (MFA with TOTP), SEC-13 (step-up for policy changes)

  change.reason:
    name: Reason
    meaning: Why the change is made or asked for. It is stored in the audit log with the change.
    unit: Text, 10 to 300 characters.
    source: user input
    source_detail: Typed by the person who makes or requests the change.
    worked_example:
      description: A reason for lifting a block.
      result: Blocked by mistake, the contract was already signed.
    allowed_range: 10 to 300 characters after trimming.
    validation: Required. Shorter or longer text is refused and nothing is changed.
    prd_ref: FR-17 (changes are logged with actor, time and reason), SEC-31

  budget.owner:
    name: Owner
    meaning: The one person who is accountable for this budget. Unowned means nobody is named.
    unit: Display name of an active user, or Unowned.
    source: user input
    source_detail: Assigned by an administrator on the budget's page.
    worked_example:
      description: The Research Agent budget in the demo data.
      result: Omar Haddad
    allowed_range: One active user, or none. An agent cannot be an owner.
    validation: A hard-limit budget must have an active owner. The database refuses the row otherwise.
    prd_ref: FR-17 (AI cost ownership), UX-8 (unowned bucket)

  budget.owner_new:
    name: New owner
    meaning: The person who will be accountable for this budget. On a hard-limit budget that already has an owner, the change waits for a second administrator.
    unit: One active user chosen from the list.
    source: user input
    source_detail: Chosen by an administrator.
    worked_example:
      description: Making an administrator the owner of the Call Notes budget.
      result: Bob Lindqvist (bob.admin)
    allowed_range: Any active user. "No owner" is offered only when the budget is not a hard limit.
    validation: Needs a reason and a fresh authenticator code.
    prd_ref: FR-17 (owner changes on a hard limit need a second administrator), SEC-15

  budget.policy_new:
    name: New policy
    meaning: What the budget should do when spend reaches the cap. Switching to a hard limit needs an active owner, and removing a limit that stops spend waits for a second administrator.
    unit: One of Monitor, Soft limit, Hard limit, Approval.
    source: user input
    source_detail: Chosen by an administrator.
    worked_example:
      description: Switching the Call Notes budget, which has no owner, to a hard limit.
      result: Refused with NO_OWNER
    allowed_range: Any policy other than the current one.
    validation: Needs a reason and a fresh authenticator code.
    prd_ref: FR-04 (budgets), FR-17 (owner required before a hard limit), SEC-15

  owner.unowned_spend:
    name: Unowned spend
    meaning: Estimated spend this period on budgets that have no accountable owner. Nobody is named to answer for it.
    unit: Money in the price list's currency, two decimals. An estimate, not a charge.
    source: calculated
    source_detail: Calculated from the gateway's usage records and the owners of the budgets.
    formula: |
      unowned = sum of estimated cost of usage whose scope has no active owner
      scope of a usage record = its project, or its team when it names no project
    formula_fn: unowned_spend
    worked_example:
      description: January 2026 in the demo data. Usage comes from the two projects in the list.
      inputs:
        period: 2026-01
        scopes_without_owner: Benchmark Runs, Call Notes, Evaluation, Sales Assist
      result: 11,971.30 USD
    allowed_range: 0 or more.
    validation: Calculated only. A disabled owner counts as no owner.
    prd_ref: FR-17 (unowned AI spend is shown as a distinct bucket), UX-8

  owner.unowned_budgets:
    name: Budgets without an owner
    meaning: How many budgets have no active person assigned as owner.
    unit: Whole number of budgets.
    source: calculated
    source_detail: Counted from the budgets and their owners.
    formula: |
      unowned_budgets = budgets - budgets with an active owner
    formula_fn: unowned_budgets
    worked_example:
      description: The demo data.
      inputs:
        budgets: "22"
        with_active_owner: "18"
      result: "4"
    allowed_range: 0 up to the number of budgets.
    validation: Calculated only.
    prd_ref: FR-17 (every AI budget must have one accountable human owner)

  held.requested_at:
    name: Held at
    meaning: When the gateway put the request on hold.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: Written by the gateway with the reservation.
    worked_example:
      description: A request held at the demo clock.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Recorded only.
    prd_ref: FR-11 (HELD queue), UX-11

  held.agent:
    name: Agent
    meaning: The agent whose request is held, with its project. It comes from the credential, never from what the request says about itself.
    unit: Agent name, with the project name below it.
    source: gateway
    source_detail: Derived from the gateway credential that sent the request.
    worked_example:
      description: The agent of the Research Agent project.
      result: research-agent
    allowed_range: A registered agent.
    validation: Recorded only.
    prd_ref: FR-11 (the approver sees request metadata), FR-05

  held.model:
    name: Model
    meaning: The registered model the request asked for.
    unit: Canonical model ID.
    source: gateway
    source_detail: The requested name after the gateway resolved aliases.
    worked_example:
      description: A request that asked for the alias model-1.
      result: vendor-a/model-1
    allowed_range: A registered model that is allowed.
    validation: A blocked or unknown model is denied and never held.
    prd_ref: FR-11 (request metadata), FR-18

  held.amount:
    name: Reserved
    meaning: The upper estimate of what the request can cost. It is set aside in the budget while the request waits and is not spent.
    unit: Money in the budget's currency. Six decimals when below one cent.
    source: gateway
    source_detail: The gateway's estimate, reserved in the ledger when the request was held.
    worked_example:
      description: A short request with a limit of 64 output tokens on vendor-a/model-1.
      result: 0.001059 USD
    allowed_range: 0 or more.
    validation: Rejecting or letting the hold expire gives the amount back to the budget.
    prd_ref: FR-11 (a hold reserves budget), FR-05

  held.budget:
    name: Budget
    meaning: The approval budget that holds the request.
    unit: Name of the budget's scope, linked to the budget.
    source: gateway
    source_detail: The budget of the agent's project.
    worked_example:
      description: A request from the research-agent.
      result: Research Agent
    allowed_range: A budget with the Approval policy.
    validation: Recorded only.
    prd_ref: FR-11 (budget impact), FR-04

  held.expires_at:
    name: Ends
    meaning: When the hold ends by itself and the budget is given back. After an approval it is the end of the 15-minute window for sending the request again.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Set from the database clock, 24 hours after the hold or 15 minutes after the approval.
    worked_example:
      description: A request held at 2026-01-15 09:00:00 UTC.
      result: "2026-01-16 09:00:00 UTC"
    allowed_range: A future time.
    validation: Expiry is judged by the database clock, not by the application.
    prd_ref: FR-11 (approval expiry releases the hold), SEC-35

  held.note:
    name: Note
    meaning: An optional remark by the approver. It is stored with the decision.
    unit: Text, at most 300 characters.
    source: user input
    source_detail: Typed in this row.
    worked_example:
      description: A note on an approval.
      result: Agreed with the team lead for the evaluation run.
    allowed_range: Empty, or up to 300 characters.
    validation: Longer text is cut to 300 characters.
    prd_ref: FR-11 (every approval records identity, reason and decision)

  held.decision:
    name: Decision
    meaning: Approve or reject the held request. Approving does not send anything, it allows the agent to send the same request once more within 15 minutes.
    unit: Two buttons, or the reason why you cannot decide.
    source: user input
    source_detail: Clicked by an administrator or by the owner of a budget above the project.
    worked_example:
      description: What the owner of the Research Agent budget sees for a request of the research-agent.
      result: Approve is disabled. This request comes from your own project.
    allowed_range: Approve, or reject.
    validation: The owner of the requesting project cannot approve. A blocked model or an active kill switch still refuses the resubmission.
    prd_ref: FR-11 (requester cannot approve their own request), UX-11, SEC-15

  approval.kind:
    name: Action
    meaning: What was asked for, in words.
    unit: Kind of action, with the exact change below it.
    source: system
    source_detail: Written when the request was made.
    worked_example:
      description: A request to lift the vendor-b block.
      result: Lift a block
    allowed_range: Held request, lift a block, switch a kill switch off, change the owner of a hard-limit budget, weaken an enforcing budget.
    validation: Recorded only.
    prd_ref: UX-11 (two-person actions), SEC-15

  approval.requested_by:
    name: Requested by
    meaning: Who asked. For a held request this is the agent, for a two-person action it is the administrator.
    unit: User name or agent name, with the time of the request.
    source: system
    source_detail: Taken from the signed-in session, or from the gateway credential for a held request.
    worked_example:
      description: A block lift asked for by an administrator.
      result: alice.admin
    allowed_range: A user or an agent.
    validation: Recorded only.
    prd_ref: FR-11 (every approval records identity), SEC-15

  approval.expires_at:
    name: Must be confirmed by
    meaning: The second administrator has until this time. After it the request closes and nothing is changed.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: 24 hours after the request was made.
    worked_example:
      description: A request made at 2026-01-15 09:00:00 UTC.
      result: "2026-01-16 09:00:00 UTC"
    allowed_range: 24 hours after the request.
    validation: An expired request cannot be approved.
    prd_ref: UX-11 (the requester sees the expiry), SEC-07 (confirm within 24 hours)

  approval.eligible:
    name: Who can approve
    meaning: The people who are allowed to be the second person. The requester is never one of them.
    unit: List of user names.
    source: calculated
    source_detail: Calculated from the active administrators.
    formula: |
      eligible = active administrators - the requester
    formula_fn: approval_eligible
    worked_example:
      description: A request made by alice.admin in the demo data.
      inputs:
        requested_by: alice.admin
        active_administrators: alice.admin, bob.admin
      result: bob.admin
    allowed_range: Zero or more administrators. With zero, nobody can approve.
    validation: Checked again by user ID when the approval is submitted, and once more by a database rule.
    prd_ref: SEC-15 (two approvers differ in identity and hold ADMIN), UX-11 (who is eligible)

  approval.decision:
    name: Decision
    meaning: Approve or reject as the second person, or see why you cannot. Your own request shows "pending second approver".
    unit: Two buttons with an authenticator code, or a status.
    source: user input
    source_detail: Clicked by a second administrator.
    worked_example:
      description: What alice.admin sees for her own request.
      result: Pending second approver
    allowed_range: Approve or reject. The requester may cancel.
    validation: Needs a fresh authenticator code. Self-approval is refused.
    prd_ref: UX-11 (self-approval is disabled with a reason), SEC-15, SEC-13

  approval.decided_at:
    name: Decided at
    meaning: When the decision was recorded.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Written with the decision.
    worked_example:
      description: A decision made at the demo clock.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Recorded only.
    prd_ref: FR-11 (decision history)

  approval.outcome:
    name: Outcome
    meaning: How the request ended.
    unit: One of Approved, Rejected, Expired, Cancelled.
    source: system
    source_detail: Written with the decision.
    worked_example:
      description: A block lift that the second administrator confirmed.
      result: Approved
    allowed_range: The four listed outcomes.
    validation: A request has one outcome and it cannot be changed.
    prd_ref: FR-11 (decision history)

  approval.decided_by:
    name: Decided by
    meaning: Who made the decision. It is "system" when a request expired.
    unit: User name.
    source: system
    source_detail: Taken from the signed-in session.
    worked_example:
      description: The second administrator of a block lift asked for by alice.admin.
      result: bob.admin
    allowed_range: A user other than the requester, or the requester when cancelled.
    validation: A database rule refuses a decision by the requester.
    prd_ref: SEC-15 (requester and approver differ), FR-11

  user.username:
    name: User name
    meaning: The name the person signs in with. It cannot be changed later.
    unit: Text, 3 to 40 characters.
    source: user input
    source_detail: Typed by the administrator who adds the user.
    worked_example:
      description: A finance user in the demo data.
      result: fiona.finance
    allowed_range: Lower-case letters, digits, dot, dash and underscore, starting with a letter.
    validation: Must be unused. Anything else is refused.
    prd_ref: FR-13 (local accounts), FR-17

  user.display_name:
    name: Name
    meaning: The person's name as it is shown as owner and in reports.
    unit: Text, 1 to 80 characters.
    source: user input
    source_detail: Typed by the administrator who adds the user.
    worked_example:
      description: The same finance user.
      result: Fiona Marchetti
    allowed_range: 1 to 80 printable characters.
    validation: Shown as text everywhere. In a CSV export a name that looks like a formula is written as plain text.
    prd_ref: FR-13 (local accounts), SEC-27, SEC-29

  user.role:
    name: Role
    meaning: What the person may do. One table in the code decides this for every page and action.
    unit: One of Administrator, Finance, Engineering, Auditor.
    source: user input
    source_detail: Chosen by the administrator who adds the user.
    worked_example:
      description: The same finance user.
      result: Finance
    allowed_range: The four listed roles.
    validation: Administrators change policy. Finance loads billing files and downloads reports. Auditors read everything and change nothing.
    prd_ref: FR-13 (role-based access control), SEC-14

  user.status:
    name: Status
    meaning: Whether the person can sign in.
    unit: One of Active, Disabled, Locked for 15 minutes.
    source: system
    source_detail: Set by an administrator, or by 5 failed sign-in attempts.
    worked_example:
      description: A demo user.
      result: Active
    allowed_range: The three listed states.
    validation: Disabling ends the person's sessions at once.
    prd_ref: FR-13 (local-account lifecycle), SEC-17

  user.owns:
    name: Budgets owned
    meaning: How many budgets name this person as owner.
    unit: Whole number of budgets.
    source: calculated
    source_detail: Counted from the budgets.
    formula: |
      owns = number of budgets whose owner is this user
    formula_fn: user_owns
    worked_example:
      description: The engineering owner in the demo data.
      inputs:
        user: omar.owner
      result: "5"
    allowed_range: 0 or more.
    validation: A user who owns a hard-limit budget cannot be disabled until another owner is assigned.
    prd_ref: FR-17 (ownership)

  user.created_at:
    name: Added
    meaning: When the account was created.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Written when the account is created.
    worked_example:
      description: The demo accounts were created 40 days before the demo clock.
      result: "2025-12-06 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Recorded only.
    prd_ref: FR-13 (local-account lifecycle)

  user.actions:
    name: Change
    meaning: Disable or enable the account, or issue a new password and authenticator secret.
    unit: Buttons with an authenticator code.
    source: user input
    source_detail: Clicked by an administrator.
    worked_example:
      description: What an administrator sees in their own row.
      result: You cannot disable or reset your own account.
    allowed_range: Disable, enable, reset sign-in.
    validation: Needs a fresh authenticator code. Each change is written to the audit log.
    prd_ref: FR-13 (local-account lifecycle), SEC-13, SEC-31

  user.initial_password:
    name: Initial password
    meaning: The password generated for the account. It is shown this once and only its hash is kept.
    unit: 20 letters and digits, without look-alike characters.
    source: system
    source_detail: Generated from operating-system randomness when the account is created or reset.
    worked_example:
      description: The form of a generated password.
      result: hX7mPq2rKd9sTn4vWb6c
    allowed_range: 20 characters.
    validation: Cannot be shown again. Reset the sign-in if it is lost.
    prd_ref: FR-13 (local accounts), SEC-13

  user.totp_secret:
    name: Authenticator secret
    meaning: The secret the person types into an authenticator app, which then shows the 6-digit codes. It is shown this once and kept encrypted.
    unit: 32 characters, base32.
    source: system
    source_detail: Generated from operating-system randomness. Stored encrypted with AES-256-GCM.
    worked_example:
      description: The form of a secret.
      result: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
    allowed_range: 160 random bits.
    validation: Cannot be shown again. Reset the sign-in if it is lost.
    prd_ref: FR-13 (MFA with TOTP), SEC-13

  kill.scope:
    name: Scope
    meaning: What the kill switch stops. All traffic, every model of one vendor, or every agent of one project.
    unit: One of All traffic, Vendor, Project.
    source: user input
    source_detail: Chosen by the administrator who switches it on.
    worked_example:
      description: Stopping everything during an incident.
      result: All traffic
    allowed_range: All traffic, a registered vendor, or an existing project.
    validation: One switch per scope can be on at a time.
    prd_ref: FR-22 (kill switch scopes), UX-7

  kill.activated_by:
    name: Switched on by
    meaning: The administrator who switched it on.
    unit: User name.
    source: system
    source_detail: Taken from the signed-in session.
    worked_example:
      description: A switch set by an administrator.
      result: alice.admin
    allowed_range: An administrator.
    validation: Recorded only.
    prd_ref: FR-22, SEC-08, SEC-31

  kill.activated_at:
    name: Switched on at
    meaning: When it was switched on. The gateway refuses requests in scope within 5 seconds of this time.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Written when the switch is set.
    worked_example:
      description: A switch set at the demo clock.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Recorded only.
    prd_ref: FR-22, SEC-08 (propagation within 5 seconds)

  kill.off:
    name: Switch off
    meaning: Ask to switch it off. It stays on until a second administrator approves.
    unit: A reason, an authenticator code and a button, or "awaiting second approver".
    source: user input
    source_detail: Asked by one administrator, approved by another on the Approvals page.
    worked_example:
      description: After one administrator has asked.
      result: Awaiting second approver
    allowed_range: One request at a time per switch.
    validation: Needs a reason and a fresh authenticator code from each of the two people.
    prd_ref: UX-7 (clearing shows "awaiting second approver"), SEC-08, SEC-15

  kill.deactivated_at:
    name: Switched off at
    meaning: When the second administrator approved switching it off.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Written when the approval is given.
    worked_example:
      description: A switch that was on for one hour from the demo clock.
      result: "2026-01-15 10:00:00 UTC"
    allowed_range: Later than the time it was switched on.
    validation: Recorded only.
    prd_ref: FR-22, SEC-08

  kill.deactivated_by:
    name: Switched off by
    meaning: The two administrators who switched it off, the one who asked and the one who approved.
    unit: Two user names.
    source: system
    source_detail: Taken from the request and from the approval.
    worked_example:
      description: A request by alice.admin approved by bob.admin.
      result: alice.admin + bob.admin
    allowed_range: Two different administrators.
    validation: The two must differ.
    prd_ref: SEC-08 (deactivation is two-person), SEC-15

  kill.impact_projects:
    name: Projects affected
    meaning: How many projects would have requests refused. For a vendor it counts projects that used the vendor in the last 24 hours.
    unit: Whole number of projects.
    source: calculated
    source_detail: Calculated from the registered projects and the gateway's recent decisions.
    formula: |
      all traffic: every registered project
      project:     1
      vendor:      projects with a gateway decision for one of the vendor's models
                   in the last 24 hours
    formula_fn: kill_impact_projects
    worked_example:
      description: A switch for all traffic in the demo data.
      inputs:
        scope: All traffic
      result: "12"
    allowed_range: 0 up to the number of projects.
    validation: Calculated only. Shown before anything is switched on.
    prd_ref: UX-7 (impact preview), FR-22

  kill.impact_agents:
    name: Agents affected
    meaning: How many agents would have requests refused. For a vendor it counts agents that used the vendor in the last 24 hours.
    unit: Whole number of agents.
    source: calculated
    source_detail: Calculated from the registered agents and the gateway's recent decisions.
    formula: |
      all traffic: every registered agent
      project:     the project's agents
      vendor:      agents with a gateway decision for one of the vendor's models
                   in the last 24 hours
    formula_fn: kill_impact_agents
    worked_example:
      description: A switch for all traffic in the demo data.
      inputs:
        scope: All traffic
      result: "12"
    allowed_range: 0 up to the number of agents.
    validation: Calculated only. Shown before anything is switched on.
    prd_ref: UX-7 (impact preview), FR-22

  kill.impact_requests:
    name: Requests in the last 5 minutes
    meaning: How many requests in scope reached the gateway in the last five minutes. It shows how much traffic the switch would stop right now.
    unit: Whole number of requests.
    source: calculated
    source_detail: Counted from the gateway's decision records.
    formula: |
      requests = gateway decisions in scope with occurred_at > now - 5 minutes
    formula_fn: kill_impact_requests
    worked_example:
      description: The demo data before any traffic was sent.
      inputs:
        scope: All traffic
        now: "2026-01-15T09:00:00Z"
      result: "0"
    allowed_range: 0 or more.
    validation: Calculated only.
    prd_ref: UX-7 (traffic in the last five minutes), FR-22

  # --- Phase 6: reports and the audit record ---------------------------------------
  showback.department:
    name: Department
    meaning: The department the project's team belongs to.
    unit: Name of the department.
    source: seed script
    source_detail: From the organization hierarchy.
    worked_example:
      description: The Build Assistant project in the demo data.
      result: Engineering
    allowed_range: A department of the organization.
    validation: Recorded only.
    prd_ref: FR-12 (reporting), FR-04 (hierarchy)

  showback.team:
    name: Team
    meaning: The team that owns the project.
    unit: Name of the team.
    source: seed script
    source_detail: From the organization hierarchy.
    worked_example:
      description: The Build Assistant project in the demo data.
      result: Platform
    allowed_range: A team of the organization.
    validation: Recorded only.
    prd_ref: FR-12 (reporting), FR-04 (hierarchy)

  audit.records:
    name: Records
    meaning: How many actions the audit log holds.
    unit: Whole number of records.
    source: system
    source_detail: Counted from the audit log.
    worked_example:
      description: The demo data holds the creation of 5 users and 3 blocks.
      result: "8"
    allowed_range: 0 or more. It only grows.
    validation: Records cannot be edited or deleted from the application.
    prd_ref: FR-12 (audit log), SEC-31

  audit.verify_result:
    name: Chain check
    meaning: Whether every record still matches its hash and follows the record before it. A changed, removed or inserted record breaks the chain at that point.
    unit: Chain verified, or Chain broken with the number of the first bad record.
    source: calculated
    source_detail: Recomputed from every record when the button is pressed.
    formula: |
      row_hash(n) = SHA-256(row_hash(n-1) || canonical(record n))
      verified    = every stored row_hash equals the recomputed one,
                    record numbers have no gap, and the last one equals the chain head
    formula_fn: audit_verify
    worked_example:
      description: The demo data as seeded.
      inputs:
        records: "8"
      result: Chain verified
    allowed_range: Verified or broken.
    validation: A broken chain raises the SEV1 alert AUDIT_CHAIN_BROKEN. Someone with full database rights could rewrite the whole chain, which needs a head stored outside the database to detect.
    prd_ref: SEC-32 (tamper-evident audit), FR-12

  audit.seq:
    name: No.
    meaning: The position of the record in the chain. Numbers have no gaps.
    unit: Whole number, starting at 1.
    source: system
    source_detail: Assigned when the record is appended.
    worked_example:
      description: The first record of the demo data.
      result: "1"
    allowed_range: 1 or more.
    validation: A missing number is reported by the chain check.
    prd_ref: SEC-32 (hash chain), FR-12

  audit.occurred_at:
    name: Time
    meaning: When the action happened.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Written with the action, in the same database transaction.
    worked_example:
      description: The vendor-b block in the demo data, two days before the demo clock.
      result: "2026-01-13 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Part of the hash, so it cannot be changed unnoticed.
    prd_ref: SEC-31 (security audit events), FR-12

  audit.actor:
    name: Who
    meaning: The signed-in user who did it. Two names mean a two-person action.
    unit: User name. "seed" for demo data, "system" for an expiry.
    source: system
    source_detail: Taken from the session, never from the form.
    worked_example:
      description: The vendor-b block in the demo data.
      result: alice.admin
    allowed_range: A user, two users, seed or system.
    validation: Part of the hash.
    prd_ref: SEC-31, SEC-15

  audit.action:
    name: Action
    meaning: What was done, as a stable code.
    unit: Code of the form area.action.
    source: system
    source_detail: Set by the code that performs the action.
    worked_example:
      description: The vendor-b block in the demo data.
      result: registry.blocked
    allowed_range: Sign-in, users, registry, budgets, approvals, kill switch, credentials, billing, exports, audit checks.
    validation: Part of the hash.
    prd_ref: SEC-31 (admin, policy, budget, owner, override and kill switch actions)

  audit.subject:
    name: On what
    meaning: The thing the action was about.
    unit: Kind and identifier.
    source: system
    source_detail: Set by the code that performs the action.
    worked_example:
      description: The vendor-b block in the demo data.
      result: vendor vendor-b
    allowed_range: A user, vendor, model, budget, kill switch, credential, report or record.
    validation: Part of the hash.
    prd_ref: SEC-31, FR-12

  audit.change:
    name: Before and after
    meaning: The values the action changed, before and after it.
    unit: Two short lists of names and values.
    source: system
    source_detail: Written with the action.
    worked_example:
      description: The vendor-b block in the demo data.
      result: 'Before {"status": "ALLOWED"} After {"status": "BLOCKED"}'
    allowed_range: Either part may be empty.
    validation: Secrets such as passwords, tokens and authenticator secrets are never written here.
    prd_ref: SEC-31, SEC-34

  audit.hash:
    name: Hash
    meaning: The first 12 characters of the record's hash. The full hash covers this record and the hash of the record before it.
    unit: 12 hexadecimal characters of a SHA-256 hash.
    source: system
    source_detail: Calculated once, when the record is appended.
    worked_example:
      description: The form of a shortened hash.
      result: 3fa9c1d07b2e  # pragma: allowlist secret (an example of the format)
    allowed_range: Hexadecimal characters.
    validation: Recomputed by the chain check.
    prd_ref: SEC-32 (hash chain), FR-12
