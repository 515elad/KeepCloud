# The "i" information registry. Every field, column and KPI in the UI reads its
# help text from here. Keys are stable field IDs: do not rename them.
#
# Tests (tests/system/test_field_help.py) fail when:
#   - the UI shows a field that has no entry here,
#   - an entry is missing its unit, or a calculated entry is missing its formula,
#   - a worked example no longer matches what the code computes on the demo data.
fields:
  health.component:
    name: Component
    meaning: A part of KeepAir that must be running for the controls to work. Each one reports that it is alive by sending a heartbeat.
    unit: Text. One of gateway, policy_sync, ledger, egress, alerting, data_sources.
    source: system
    source_detail: Fixed list defined in the application (keepair.health.COMPONENTS).
    worked_example:
      description: The first component in the health strip.
      result: gateway
    allowed_range: Only the six listed components.
    validation: A heartbeat for any other component name is rejected.
    prd_ref: UX-6 (health strip), FR-21 (heartbeats)

  health.status:
    name: Status
    meaning: Whether a component is known to be working, judged by how recent its last heartbeat is. Unknown means there is no evidence either way, and it is never shown as healthy.
    unit: Text. One of Healthy, Degraded, Failing, Unknown.
    source: calculated
    source_detail: Calculated on each page load from the last heartbeat and the current time.
    formula: |
      age_s = now - last_heartbeat_at
      status = Unknown   when last_heartbeat_at is none, or age_s < 0
      status = Healthy   when age_s <= degraded_after_s
      status = Degraded  when age_s <= failing_after_s
      status = Failing   otherwise
    formula_fn: health_status
    worked_example:
      description: The gateway component in the demo data. No heartbeat has been recorded yet, so the status is Unknown.
      inputs:
        component: gateway
        last_heartbeat_at: none
        now: "2026-01-15T09:00:00Z"
        degraded_after_s: "60"
        failing_after_s: "180"
      result: Unknown
    allowed_range: Exactly one of the four states.
    validation: A heartbeat dated in the future is not trusted and gives Unknown.
    prd_ref: UX-6 (health strip), FR-21 (control assurance), SEC-37

  health.last_heartbeat_at:
    name: Last heartbeat
    meaning: The last time the component reported that it is alive. "never" means no heartbeat has been received.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Written by each component when it sends a heartbeat (table heartbeats).
    worked_example:
      description: The gateway component in the demo data has not sent a heartbeat.
      result: never
    allowed_range: Any past time, or never.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: FR-21 (heartbeats), SEC-37

  demo.clock:
    name: Demo data as of
    meaning: The fixed moment the demo data set was generated for. It never changes, so the demo data is identical on every run.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: seed script
    source_detail: Set by the demo seed script (keepair.demo.seed) together with a fixed random seed.
    worked_example:
      description: The value in the demo data.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: One fixed value per demo data set.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: Section 2.3 of the v1.4 build spec (injected clock and seed)

  alert.raised_at:
    name: Raised
    meaning: When the failure was detected.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Set from the application clock when the failure is reported.
    worked_example:
      description: The demo data starts with no alerts. A database outage detected at the demo clock time would show this value.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: FR-21 (failure visibility), SEC-36

  alert.severity:
    name: Severity
    meaning: How urgent the alert is. SEV1 is the most urgent.
    unit: Text. One of SEV1, SEV2, SEV3.
    source: system
    source_detail: Fixed per reason code in the application (keepair.failures.FAILURE_CODES).
    worked_example:
      description: A database outage (DATABASE_UNREACHABLE) is raised as SEV2.
      result: SEV2
    allowed_range: SEV1, SEV2 or SEV3.
    validation: Any other value is rejected by the database.
    prd_ref: FR-21 (alert severities), FR-22

  alert.code:
    name: Code
    meaning: The stable reason code for the failure. Use it to search logs and runbooks.
    unit: Text, upper case with underscores.
    source: system
    source_detail: Chosen from the registered list of failure codes when the failure is reported.
    worked_example:
      description: The code raised when the database cannot be reached.
      result: DATABASE_UNREACHABLE
    allowed_range: Only codes registered in the application.
    validation: Reporting an unregistered code is refused.
    prd_ref: SEC-36 (no silent failure), SEC-11 (stable reason codes)

  alert.component:
    name: Affected component
    meaning: The part of KeepAir the failure belongs to.
    unit: Text.
    source: system
    source_detail: Fixed per reason code in the application.
    worked_example:
      description: A database outage affects the ledger.
      result: ledger
    allowed_range: A health strip component, or app for the web application itself.
    validation: Set by the application. It cannot be entered by a user.
    prd_ref: FR-21 (failure visibility), UX-6

  alert.message:
    name: What happened
    meaning: A plain-language description of the failure and its effect.
    unit: Text.
    source: system
    source_detail: Written by the application when the failure is reported. It never contains request content or credentials.
    worked_example:
      description: The message for a database outage.
      result: The database could not be reached. Component health and demo data cannot be read, so every component is shown as Unknown.
    allowed_range: Free text written by the application.
    validation: Escaped when shown. Never built from user input.
    prd_ref: SEC-36 (no silent failure), SEC-34 (redaction)

  budget.scope:
    name: Budget
    meaning: The part of the organization this budget belongs to. Budgets follow the hierarchy of organization, department, team and project.
    unit: Text. The scope name, with its level underneath.
    source: seed script
    source_detail: Demo hierarchy from the seed script. Budgets cannot be created in the UI yet.
    worked_example:
      description: A project budget in the demo data.
      result: Research Agent (Project)
    allowed_range: One budget per scope and period.
    validation: The database refuses a second budget for the same scope, period and start date.
    prd_ref: FR-04 (hierarchical budgets)

  project.coverage:
    name: Coverage
    meaning: How much control KeepAir has over a project's AI spend. Enforced is shown only when the gateway is used, KeepAir holds the provider key, and egress control is verified.
    unit: Text. One of Enforced, Gateway-routed, Monitored, Uncontrolled.
    source: calculated
    source_detail: Calculated from the project's key custody, its egress check and any uncontrolled-spend finding.
    formula: |
      coverage = Uncontrolled    when uncontrolled_finding is yes
      coverage = Monitored       when key_custody is not KEEPAIR
      coverage = Enforced        when egress_verified is yes
      coverage = Gateway-routed  otherwise
    formula_fn: coverage_state
    worked_example:
      description: The Research Agent project in the demo data. KeepAir holds the key, but egress control is not verified.
      inputs:
        project: Research Agent
        key_custody: KEEPAIR
        egress_verified: "no"
        uncontrolled_finding: "no"
      result: Gateway-routed
    allowed_range: Exactly one of the four states. Enforced cannot appear in the MVP because egress control (FR-20) is not built.
    validation: Calculated only. It cannot be set by hand.
    prd_ref: UX-2 (coverage badge), UX-D1 (pending decision, default Gateway-routed), FR-20

  budget.policy:
    name: Policy
    meaning: What happens when spend reaches the cap. Monitor and Soft limit only report; Hard limit and Approval limit spend.
    unit: Text. One of Monitor, Soft limit, Hard limit, Approval.
    source: seed script
    source_detail: Set per budget. Demo values come from the seed script.
    worked_example:
      description: The Research Agent project budget in the demo data.
      result: Approval
    allowed_range: MONITOR, SOFT, HARD or APPROVAL.
    validation: Any other value is rejected by the database. A hard limit will also need an owner from phase 5.
    prd_ref: FR-05 (policy modes), FR-04

  budget.mode:
    name: Mode
    meaning: Whether the budget stands alone or is a share of its parent. A Subdivision budget is also limited by its parent; an Independent budget is not.
    unit: Text. Independent or Subdivision.
    source: seed script
    source_detail: Set per budget. The default is Independent.
    worked_example:
      description: The Research Agent project budget is a share of the Agents team budget.
      result: Subdivision
    allowed_range: INDEPENDENT or SUBDIVISION.
    validation: A Subdivision budget must have a parent in the same currency.
    prd_ref: FR-04 (independent cap or subdivision)

  budget.period:
    name: Period
    meaning: The time span the cap applies to.
    unit: Period type, then first and last day as ISO 8601 dates.
    source: seed script
    source_detail: Set per budget. Demo values come from the seed script.
    worked_example:
      description: The Research Agent project budget.
      result: Month, 2026-01-01 to 2026-01-31
    allowed_range: Month, Quarter or Year.
    validation: Any other period is rejected by the database.
    prd_ref: FR-04 (monthly, quarterly and annual budgets)

  budget.cap:
    name: Cap
    meaning: The most this budget may spend in its period.
    unit: Money in the budget's currency. Stored as micro-units (1 unit = 1,000,000 micro-units), shown with two decimals and the ISO 4217 code.
    source: seed script
    source_detail: Set per budget. Demo values come from the seed script.
    worked_example:
      description: The Research Agent project budget.
      result: 35,000.00 USD
    allowed_range: 0 or more.
    validation: Whole micro-units, never negative. The currency must be a three-letter ISO 4217 code.
    prd_ref: FR-04, FR-02 (money as micro-units)

  budget.committed:
    name: Committed
    meaning: Money already spent against this budget in the period, including spend of its Subdivision sub-budgets.
    unit: Money in the budget's currency. Stored as micro-units, shown with two decimals.
    source: gateway
    source_detail: Written by the gateway when a request is settled, on top of the seeded opening value.
    worked_example:
      description: The Research Agent project budget.
      result: 14,000.00 USD
    allowed_range: 0 or more.
    validation: Never negative (database check).
    prd_ref: FR-05 (settle), FR-04, UX-8

  budget.reserved:
    name: Reserved
    meaning: Money held for requests that are in flight and not yet settled. It is not spent, and it is released if the request costs less.
    unit: Money in the budget's currency. Stored as micro-units, shown with two decimals.
    source: gateway
    source_detail: Written by the gateway when a request is reserved, and released when it settles. The seeded opening value stands for long-running requests.
    worked_example:
      description: The Research Agent project budget.
      result: 1,750.00 USD
    allowed_range: 0 or more.
    validation: Never negative (database check).
    prd_ref: FR-05 (reserve), UX-8 (reserved is not spent)

  budget.usage:
    name: Usage
    meaning: How much of the cap is committed and how much is reserved. Marks show 50, 80, 90 and 100% of the cap.
    unit: Percentage of the cap, two decimals, rounded down. The bar itself is drawn in whole percent.
    source: calculated
    source_detail: Calculated from cap, committed and reserved.
    formula: |
      committed_pct = committed / cap x 100
      reserved_pct  = reserved / cap x 100
      remaining_pct = 100 - committed_pct - reserved_pct  (0 when over the cap)
    formula_fn: budget_usage
    worked_example:
      description: The Research Agent project budget.
      inputs:
        cap: 35,000.00 USD
        committed: 14,000.00 USD
        reserved: 1,750.00 USD
      result: Committed 40.00%, reserved 5.00%, remaining 55.00%
    allowed_range: 0% upward. More than 100% in total means the budget is over its cap.
    validation: A cap of 0 shows 0%.
    prd_ref: UX-8 (budget bar), FR-04 (threshold examples)

  budget.remaining:
    name: Remaining
    meaning: What is left of this budget's own cap. It does not take parent budgets into account.
    unit: Money in the budget's currency, two decimals.
    source: calculated
    source_detail: Calculated from cap, committed and reserved.
    formula: |
      remaining = cap - committed - reserved
    formula_fn: budget_remaining
    worked_example:
      description: The Research Agent project budget.
      inputs:
        cap: 35,000.00 USD
        committed: 14,000.00 USD
        reserved: 1,750.00 USD
      result: 19,250.00 USD
    allowed_range: Any amount. Below zero it is shown as "Over cap by" the amount.
    validation: Calculated only.
    prd_ref: FR-04 (remaining budget)

  budget.enforcing:
    name: Limits spend
    meaning: Whether this budget can stop spend. Only Hard limit and Approval budgets do.
    unit: Yes or No.
    source: calculated
    source_detail: Calculated from the budget's policy.
    formula: |
      limits_spend = Yes when policy is Hard limit or Approval, otherwise No
    formula_fn: budget_enforcing
    worked_example:
      description: The Research Agent project budget.
      inputs:
        policy: Approval
      result: "Yes"
    allowed_range: Yes or No.
    validation: Calculated only.
    prd_ref: FR-04 (monitor and soft-limit budgets never block)

  budget.effective_remaining:
    name: Effective remaining
    meaning: What can still be spent here once parent limits are applied. It is the lowest remaining amount among this budget and the parents that limit it.
    unit: Money in the budget's currency, two decimals. "No enforced limit" when no budget on the path limits spend.
    source: calculated
    source_detail: Calculated from this budget and its parents. The gateway uses the same function.
    formula: |
      path = this budget, then each parent while the budget below it is a Subdivision
      remaining(x) = cap(x) - committed(x) - reserved(x)
      effective_remaining = min over x in path, where x limits spend, of remaining(x)
    formula_fn: budget_effective_remaining
    worked_example:
      description: The Research Agent project in the demo data. It has 19,250.00 USD of its own cap left, but the Engineering department has less, so Engineering sets the allowance. Northwind Labs is a soft limit and does not count.
      inputs:
        remaining(Research Agent, Approval): 19,250.00 USD
        remaining(Agents, Approval): 18,750.00 USD
        remaining(Engineering, Hard limit): 10,550.00 USD
        remaining(Northwind Labs, Soft limit): not limiting
      result: 10,550.00 USD
    allowed_range: 0 or more, or "No enforced limit".
    validation: Calculated only. Never shown below zero.
    prd_ref: FR-04 (effective remaining allowance), UX-8 (subdivision warning)

  vendor.id:
    name: Vendor
    meaning: The canonical identifier of a model vendor.
    unit: Text, lower case.
    source: seed script
    source_detail: Registry table. Demo vendors are fictional.
    worked_example:
      description: The blocked vendor in the demo data.
      result: vendor-b
    allowed_range: Registered vendors only.
    validation: Unique per tenant.
    prd_ref: FR-18 (canonical registry)

  vendor.status:
    name: Status
    meaning: Whether requests to this vendor are allowed. A blocked vendor blocks all of its models.
    unit: Text. Allowed or Blocked.
    source: user input
    source_detail: Set by an administrator. Demo values come from the seed script.
    worked_example:
      description: vendor-b in the demo data.
      result: Blocked
    allowed_range: ALLOWED or BLOCKED. There is no third state.
    validation: Any other value is rejected by the database.
    prd_ref: FR-18 (vendor block overrides model allow), UX-3

  registry.switch:
    name: Allowed switch
    meaning: Switching it off adds a block after you give a reason. Switching a block off again needs two administrators and is not available until phase 5.
    unit: On (allowed) or off (blocked).
    source: user input
    source_detail: Administrator action in this screen.
    worked_example:
      description: The switch for vendor-b/model-1 in the demo data. It is locked because vendor-b is blocked.
      result: Off, locked
    allowed_range: On to off only in phase 1.
    validation: A reason of 10 to 300 characters is required to block. A model under a blocked vendor cannot be switched.
    prd_ref: FR-18 (emergency block one step, lift needs two administrators), UX-3, SD-03 (pending decision)

  registry.last_change:
    name: Last change
    meaning: When the status last changed, who changed it and why.
    unit: Date and time, ISO 8601, stored in UTC, shown as YYYY-MM-DD HH:MM:SS UTC. Then the actor and the reason.
    source: system
    source_detail: Recorded with every status change (table registry_changes).
    worked_example:
      description: The block on vendor-b in the demo data.
      result: "2026-01-13 09:00:00 UTC, demo-admin: Contract review in progress. Blocked until legal sign-off."
    allowed_range: Any past time.
    validation: Written by the application together with the change, in one transaction.
    prd_ref: UX-3 (who, when and why), FR-18 (registry changes are audited)

  model.id:
    name: Model
    meaning: The canonical identifier of a model. Every alias resolves to exactly one of these.
    unit: Text, lower case, vendor/model.
    source: seed script
    source_detail: Registry table. Demo models are fictional.
    worked_example:
      description: A model of the blocked vendor in the demo data.
      result: vendor-b/model-1
    allowed_range: Registered models only. An unregistered name is denied.
    validation: Lower case with no surrounding spaces (database check).
    prd_ref: FR-18 (canonical registry, default deny)

  model.vendor:
    name: Vendor
    meaning: The vendor this model belongs to. The vendor's status applies to the model.
    unit: Text, lower case.
    source: seed script
    source_detail: Registry table.
    worked_example:
      description: The vendor of vendor-b/model-1.
      result: vendor-b
    allowed_range: A registered vendor.
    validation: Must exist in the vendor table (foreign key).
    prd_ref: FR-18

  model.aliases:
    name: Aliases
    meaning: Other names that resolve to this model. A block on the model or its vendor applies to every alias.
    unit: Text, lower case.
    source: seed script
    source_detail: Alias table.
    worked_example:
      description: The alias of vendor-b/model-1 in the demo data.
      result: vb-large
    allowed_range: Each alias points to exactly one model.
    validation: Lower case with no surrounding spaces. Unique per tenant.
    prd_ref: FR-18 (alias resolution)

  model.effective_status:
    name: Status
    meaning: Whether requests for this model are allowed right now, after the vendor's status is applied. A model is never shown as Allowed while its vendor is blocked.
    unit: Text. Allowed, Blocked, or Blocked by vendor.
    source: calculated
    source_detail: Calculated from the vendor's status and the model's own setting.
    formula: |
      status = Blocked by vendor  when vendor_status is BLOCKED
      status = Blocked            when model_status is BLOCKED
      status = Allowed            when both are ALLOWED
    formula_fn: model_effective_status
    worked_example:
      description: vendor-b/model-1 in the demo data. Its own setting is allowed, but vendor-b is blocked.
      inputs:
        model: vendor-b/model-1
        vendor_status: BLOCKED
        model_status: ALLOWED
      result: Blocked by vendor vendor-b
    allowed_range: Exactly one of the three.
    validation: Calculated only.
    prd_ref: FR-18 (vendor block overrides model allow), UX-3 (block cascade), SEC-05

  model.input_price:
    name: Input price
    meaning: The price of 1,000 input tokens, used to estimate a request's cost before it is sent.
    unit: Money per 1,000 tokens. Stored as micro-units, shown with up to six decimals.
    source: seed script
    source_detail: Registry table. Demo prices are invented.
    worked_example:
      description: vendor-b/model-1 in the demo data (2,500 micro-units).
      result: 0.0025 USD
    allowed_range: 0 or more.
    validation: Whole micro-units, never negative.
    prd_ref: FR-05 (estimate), v1.4 Section 2.5 (models table)

  model.output_price:
    name: Output price
    meaning: The price of 1,000 output tokens, used to estimate a request's cost before it is sent.
    unit: Money per 1,000 tokens. Stored as micro-units, shown with up to six decimals.
    source: seed script
    source_detail: Registry table. Demo prices are invented.
    worked_example:
      description: vendor-b/model-1 in the demo data (10,000 micro-units).
      result: 0.01 USD
    allowed_range: 0 or more.
    validation: Whole micro-units, never negative.
    prd_ref: FR-05 (estimate), v1.4 Section 2.5 (models table)

  model.max_output_tokens:
    name: Max output tokens
    meaning: The most tokens the model can return in one response. It caps the cost estimate for a request.
    unit: Whole number of tokens.
    source: seed script
    source_detail: Registry table.
    worked_example:
      description: vendor-b/model-1 in the demo data.
      result: "8,192"
    allowed_range: 1 or more.
    validation: Must be greater than zero (database check).
    prd_ref: FR-05 (estimate upper bound)

  unregistered.name:
    name: Requested name
    meaning: A model name that was requested but that nobody has registered. Requests for it are denied.
    unit: Text, as normalized (lower case, trimmed).
    source: gateway
    source_detail: Recorded by the gateway when it denies an unknown model. The first demo row comes from the seed script.
    worked_example:
      description: The unregistered model in the demo data.
      result: vendor-a/model-9
    allowed_range: Names with no registry entry and no alias.
    validation: Shown escaped. It never becomes a registry entry by itself.
    prd_ref: UX-4 (blocked, denied and unregistered), FR-18 (default deny), D-03 (pending decision)

  unregistered.seen_count:
    name: Requests
    meaning: How many requests asked for this name.
    unit: Whole number.
    source: gateway
    source_detail: Counted by the gateway. The opening demo value comes from the seed script.
    worked_example:
      description: vendor-a/model-9 in the demo data.
      result: "14"
    allowed_range: 1 or more.
    validation: Must be greater than zero (database check).
    prd_ref: UX-4, D-03

  unregistered.first_seen_at:
    name: First seen
    meaning: When this name was first requested.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: Recorded by the gateway. The opening demo value comes from the seed script.
    worked_example:
      description: vendor-a/model-9 in the demo data.
      result: "2026-01-12 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: UX-4, D-03

  unregistered.last_seen_at:
    name: Last seen
    meaning: When this name was most recently requested.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: Recorded by the gateway. The opening demo value comes from the seed script.
    worked_example:
      description: vendor-a/model-9 in the demo data.
      result: "2026-01-15 08:00:00 UTC"
    allowed_range: Any past time, not before First seen.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: UX-4, D-03

  unregistered.register:
    name: Action
    meaning: Registers the name as a model so that it can be allowed or blocked. This action is not built yet.
    unit: Button.
    source: user input
    source_detail: Administrator action in this screen.
    worked_example:
      description: The action for vendor-a/model-9 in the demo data.
      result: Register model (disabled, not built yet)
    allowed_range: One registration per name.
    validation: Disabled. Models are added through the seed data for now.
    prd_ref: UX-4 (Unregistered offers "Register model")

  block.impact:
    name: Models that will be denied
    meaning: Every model that requests will be refused for once this block is added.
    unit: List of canonical model identifiers.
    source: calculated
    source_detail: Calculated from the registry. Blocking a vendor lists all of its models.
    formula: |
      blocking a vendor: affected = every model whose vendor is that vendor
      blocking a model:  affected = that model
    formula_fn: block_impact
    worked_example:
      description: Blocking vendor-a in the demo data.
      inputs:
        subject: vendor vendor-a
      result: vendor-a/model-1, vendor-a/model-2, vendor-a/model-3
    allowed_range: Zero or more registered models.
    validation: Calculated only.
    prd_ref: FR-18 (vendor block denies every model of that vendor), UX-7 (impact preview)

  block.reason:
    name: Reason
    meaning: Why the block is being added. It is stored with the change and shown as the last change.
    unit: Text, 10 to 300 characters.
    source: user input
    source_detail: Typed by the administrator who adds the block.
    worked_example:
      description: The reason recorded for the vendor-b block in the demo data.
      result: Contract review in progress. Blocked until legal sign-off.
    allowed_range: 10 to 300 characters after trimming.
    validation: Required. Shorter or longer text is refused and nothing is changed.
    prd_ref: FR-18 (every registry change is recorded with a reason), UX-3

  gateway.requests_24h:
    name: Requests
    meaning: How many requests reached the gateway with a valid credential in the last 24 hours.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the gateway's decision records.
    formula: |
      requests = number of decision records with occurred_at later than now - 24 hours
    formula_fn: gateway_requests
    worked_example:
      description: The seeded demo data has no gateway traffic yet. After the scripted demo traffic it shows 500.
      inputs:
        decision_records_in_window: "0"
      result: "0"
    allowed_range: 0 or more.
    validation: Calculated only. Requests with a missing or wrong token are counted in metrics, not here.
    prd_ref: UX-5 (denials feed), FR-05

  gateway.refused_24h:
    name: Denied
    meaning: How many of those requests the gateway refused.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the gateway's decision records.
    formula: |
      denied = number of decision records in the last 24 hours with outcome DENIED
    formula_fn: gateway_refused
    worked_example:
      description: The seeded demo data has no gateway traffic yet.
      inputs:
        denied_records_in_window: "0"
      result: "0"
    allowed_range: 0 up to Requests.
    validation: Calculated only.
    prd_ref: UX-5, SEC-11 (denial contract)

  gateway.held_24h:
    name: Held
    meaning: How many requests are waiting for an approver because their project's budget has the Approval policy. Nothing is sent to a vendor while a request is held.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the gateway's decision records.
    formula: |
      held = number of decision records in the last 24 hours with outcome HELD
    formula_fn: gateway_held
    worked_example:
      description: The seeded demo data has no gateway traffic yet.
      inputs:
        held_records_in_window: "0"
      result: "0"
    allowed_range: 0 up to Requests. At most 20 open holds per credential.
    validation: Calculated only.
    prd_ref: FR-11 (HELD queue), FR-05 (approval policy), D-07

  gateway.last_request_at:
    name: Last request
    meaning: When the gateway last decided a request. It shows that traffic is arriving, so that zero denials is not mistaken for a gateway nobody uses.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: The newest decision record of any outcome.
    worked_example:
      description: The seeded demo data has no gateway traffic yet.
      result: never
    allowed_range: Any past time, or never.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: UX-10 (no denials state shows the last gateway request)

  denial.reason:
    name: Reason
    meaning: Why the request was refused or held, in plain words, with the stable reason code next to it. Agents receive only the code.
    unit: Text, then the code in upper case.
    source: gateway
    source_detail: Set by the gateway step that refused the request.
    worked_example:
      description: A request for a model of blocked vendor-b.
      result: The vendor is blocked VENDOR_BLOCKED
    allowed_range: Only codes registered in the gateway.
    validation: The plain-language text is looked up from the code. It is never taken from the request.
    prd_ref: UX-5 (reason in plain language, code in monospace), SEC-11, UX-D3

  denial.count_24h:
    name: Requests
    meaning: How many requests were refused or held for this reason in the last 24 hours.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the gateway's decision records.
    formula: |
      requests(reason) = number of denied or held decision records in the last 24 hours with that reason code
    formula_fn: denial_count
    worked_example:
      description: The seeded demo data has no gateway traffic yet, so there is no refusal for VENDOR_BLOCKED.
      inputs:
        reason: VENDOR_BLOCKED
      result: "0"
    allowed_range: 1 or more for a listed reason.
    validation: Calculated only. A reason with no refusals is not listed.
    prd_ref: UX-5 (grouped by reason)

  denial.trend:
    name: Last 24 hours
    meaning: How the refusals for this reason are spread over the last 24 hours, one point per hour, oldest on the left.
    unit: Requests per hour. The line is scaled to the busiest hour, which is given in words next to it.
    source: calculated
    source_detail: Counted from the gateway's decision records.
    formula: |
      point(h) = number of refusals with this reason whose age is h hours, for h = 23 down to 0
    formula_fn: denial_trend
    worked_example:
      description: The seeded demo data has no gateway traffic yet, so every hour is 0.
      inputs:
        reason: VENDOR_BLOCKED
      result: at most 0 in one hour
    allowed_range: 0 or more per hour.
    validation: Calculated only.
    prd_ref: UX-5 (sparkline per reason), UX-14 (every chart has a text summary)

  denial.time:
    name: Time
    meaning: When the gateway refused or held the request.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: Set from the gateway's clock when the decision is recorded.
    worked_example:
      description: A refusal recorded at the demo clock time would show this value.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: UX-5

  denial.agent:
    name: Agent
    meaning: The agent whose credential made the request, with its project underneath. It comes from the credential, never from anything the request says about itself.
    unit: Text.
    source: gateway
    source_detail: Derived from the gateway credential.
    worked_example:
      description: The agent of the Research Agent project in the demo data.
      result: research-agent (Research Agent)
    allowed_range: Agents registered in KeepAir.
    validation: Client headers such as X-Project are ignored.
    prd_ref: UX-5, FR-05 (principal from the credential), FR-06

  denial.model:
    name: Requested model
    meaning: The model name exactly as the request asked for it. It can be an alias or a name nobody registered.
    unit: Text, at most 200 characters.
    source: gateway
    source_detail: Copied from the request body.
    worked_example:
      description: A request that used an alias of a vendor-b model.
      result: vb-large
    allowed_range: Any text.
    validation: Untrusted input. Shown escaped and never used for policy before it is resolved in the registry.
    prd_ref: UX-5, SEC-27 (output encoding), FR-18

  denial.budget:
    name: Budget
    meaning: The budget that stopped or holds the request. Empty when the refusal had nothing to do with a budget.
    unit: Text. The budget's scope name.
    source: gateway
    source_detail: Recorded by the ledger when it refuses or holds a reservation.
    worked_example:
      description: A request refused because the Summaries EU project budget had no room.
      result: Summaries EU
    allowed_range: A budget on the project's limit path, or empty.
    validation: Shown in this screen only. The agent's error response never names a budget or an amount.
    prd_ref: UX-5, SEC-11 (no budget amounts or internal identifiers in the response)

  denial.request_id:
    name: Request ID
    meaning: The identifier the gateway gave the request. The agent received the same ID, so a report from a developer can be matched to this row.
    unit: UUID version 7.
    source: gateway
    source_detail: Generated by the gateway for every request and returned in the X-KeepAir-Request-Id header.
    worked_example:
      description: The shape of a request ID.
      result: 019bc0f7-7480-7xxx-xxxx-xxxxxxxxxxxx
    allowed_range: One per request.
    validation: Generated by the gateway. It cannot be supplied by the client.
    prd_ref: UX-5, SEC-11 (request ID in every denial)

  credential.agent:
    name: Agent
    meaning: The agent this credential belongs to, with its project underneath. Spend made with the credential is charged to that project's budget.
    unit: Text.
    source: seed script
    source_detail: Agents come from the demo seed. Each project has one.
    worked_example:
      description: The agent of the Research Agent project in the demo data.
      result: research-agent (Research Agent)
    allowed_range: Agents of this tenant.
    validation: Must exist (foreign key).
    prd_ref: FR-05 (authenticate), FR-17 (each agent has its own credential)

  credential.label:
    name: Label
    meaning: A short name that tells credentials of the same agent apart.
    unit: Text, 1 to 60 characters.
    source: user input
    source_detail: Typed when the credential is created. Demo credentials are labelled demo.
    worked_example:
      description: The label of the seeded demo credentials.
      result: demo
    allowed_range: 1 to 60 characters.
    validation: Required. Shown escaped.
    prd_ref: FR-05 (credentials), SEC-27

  credential.status:
    name: Status
    meaning: Whether the gateway accepts this credential right now.
    unit: Text. Active, Expired or Revoked.
    source: calculated
    source_detail: Calculated from the revocation time and the expiry time, judged by the database clock.
    formula: |
      status = Revoked  when revoked_at is set
      status = Expired  when expires_at <= now
      status = Active   otherwise
    formula_fn: credential_status
    worked_example:
      description: The demo credential of the Research Agent project. It was issued when the demo data was loaded and is valid for 90 days.
      inputs:
        agent: research-agent
        revoked_at: none
        expires_at: 90 days after it was issued
      result: Active
    allowed_range: Exactly one of the three.
    validation: Calculated only. A revoked or expired credential is refused at the next request.
    prd_ref: SEC-12 (90-day maximum, revocation), SD-02 (pending decision)

  credential.created_at:
    name: Created
    meaning: When the credential was created.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Set from the database clock when the credential is created.
    worked_example:
      description: A credential created at the demo clock time would show this value.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Set by the database. It cannot be entered.
    prd_ref: SEC-12

  credential.expires_at:
    name: Expires
    meaning: When the credential stops working. It is 90 days after creation.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: system
    source_detail: Set from the database clock when the credential is created.
    worked_example:
      description: A credential created at the demo clock time would expire at this value.
      result: "2026-04-15 09:00:00 UTC"
    allowed_range: At most 90 days after Created.
    validation: The database refuses a lifetime longer than 90 days.
    prd_ref: SEC-12 (90-day maximum), SD-02 (pending decision)

  credential.revoke:
    name: Revoke
    meaning: Stops the credential at once. The agent's next request is refused, and this cannot be undone.
    unit: Button.
    source: user input
    source_detail: Administrator action in this screen.
    worked_example:
      description: The action for an active demo credential.
      result: Revoke
    allowed_range: Active credentials only.
    validation: One step. Revoking only narrows access.
    prd_ref: SEC-12 (revocation), FR-05 (rotation creates a new token and revokes the old one)

  credential.new_agent:
    name: Agent
    meaning: The agent the new credential is for.
    unit: Choice from the list of agents.
    source: user input
    source_detail: Chosen in the form.
    worked_example:
      description: Creating a credential for the Research Agent project's agent.
      result: research-agent (Research Agent)
    allowed_range: Agents of this tenant.
    validation: Required. An unknown agent is refused.
    prd_ref: FR-05 (credentials), FR-17

  credential.token:
    name: Token
    meaning: The secret the agent sends to the gateway. It is shown once, here, and cannot be shown again.
    unit: Text. kair_, then 43 characters, then a 6-character checksum.
    source: system
    source_detail: Generated from 256 random bits when the credential is created. Only its SHA-256 hash is stored.
    worked_example:
      description: The shape of a token. This is not a working token.
      result: kair_<43 characters>_<6 characters>
    allowed_range: 256 bits of randomness.
    validation: A token with a wrong checksum is refused before any database lookup.
    prd_ref: SEC-12 (256-bit, hashed), SEC-22 (prefix and checksum), FR-05

  failopen.banner:
    name: Fail-open banner
    meaning: Tells everyone that requests were sent without a budget check because the ledger could not be reached. It stays until the ledger is back, the spool is written to the ledger, and someone acknowledges it.
    unit: Count of requests, and times as YYYY-MM-DD HH:MM:SS UTC.
    source: calculated
    source_detail: While it is active the count comes from the gateway's spool. Afterwards it is the number of recorded fail-open events nobody has acknowledged.
    formula: |
      shown = gateway reports the ledger unreachable
              or requests wait in the spool
              or unacknowledged fail-open events exist
      count = requests waiting in the spool + unacknowledged events
    formula_fn: fail_open_banner
    worked_example:
      description: The seeded demo data. The ledger was never down, so the banner is not shown.
      inputs:
        ledger_unreachable: "no"
        waiting_in_spool: "0"
        unacknowledged_events: "0"
      result: not shown, count 0
    allowed_range: Shown or not shown.
    validation: It cannot be dismissed while fail-open is active or the spool is not yet replayed.
    prd_ref: UX-7 (fail-open banner), SEC-06, SD-04 (pending decision)

  failopen.state:
    name: Fail-open
    meaning: Whether the gateway is sending requests without a budget check right now. Unknown means the gateway did not answer, which is not the same as not active.
    unit: Text. Active, Not active or Unknown.
    source: gateway
    source_detail: Asked from the gateway directly, so it is known even when this screen cannot read the database.
    worked_example:
      description: The seeded demo data, with the gateway running and the ledger reachable.
      result: Not active
    allowed_range: Exactly one of the three.
    validation: Reported by the gateway. It cannot be set here.
    prd_ref: UX-7, FR-21 (failure visibility), UX-6 (Unknown is never shown as healthy)

  failopen.waiting:
    name: Waiting in the spool
    meaning: Requests that were sent without a budget check and are not yet written to the ledger. They are written when the ledger is back.
    unit: Whole number.
    source: gateway
    source_detail: Counted by the gateway from its encrypted spool.
    worked_example:
      description: The seeded demo data. Nothing was spooled.
      result: "0"
    allowed_range: 0 up to the spool's limit of 10,000 records, 100 MB or one hour.
    validation: When a limit is reached, further requests are refused.
    prd_ref: SEC-06 (encrypted spool, capped), SD-04 (pending decision)

  failopen.events:
    name: Recorded
    meaning: How many requests were sent without a budget check and have since been written to the ledger.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the fail-open event records.
    formula: |
      recorded = number of fail-open event records
    formula_fn: fail_open_events
    worked_example:
      description: The seeded demo data. The ledger was never down.
      inputs:
        fail_open_event_records: "0"
      result: "0"
    allowed_range: 0 or more.
    validation: Calculated only. Each spooled request becomes exactly one record, however often the spool is replayed.
    prd_ref: FR-12 (fail-open activity report), FR-05 (every fail-open request is counted)

  failopen.unacknowledged:
    name: Not acknowledged
    meaning: How many of the recorded requests nobody has acknowledged yet. The banner stays while this is above zero.
    unit: Whole number.
    source: calculated
    source_detail: Counted from the fail-open event records.
    formula: |
      not_acknowledged = number of fail-open event records with no acknowledgement time
    formula_fn: fail_open_unacknowledged
    worked_example:
      description: The seeded demo data. The ledger was never down.
      inputs:
        records_without_acknowledgement: "0"
      result: "0"
    allowed_range: 0 up to Recorded.
    validation: Calculated only.
    prd_ref: UX-7 (cannot be dismissed until acknowledged), FR-12

  failopen.time:
    name: Time
    meaning: When the request was sent.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: The gateway's clock when it wrote the spool record, before sending.
    worked_example:
      description: A request spooled at the demo clock time would show this value.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Any past time.
    validation: Must carry a timezone. Stored as UTC.
    prd_ref: FR-12 (fail-open report)

  failopen.agent:
    name: Agent
    meaning: The agent whose credential made the request, with its project underneath.
    unit: Text.
    source: gateway
    source_detail: Derived from the gateway credential and kept in the spool record.
    worked_example:
      description: The agent of the Ticket Triage project, whose budgets are all soft.
      result: ticket-triage-agent (Ticket Triage)
    allowed_range: Agents whose whole budget path is monitor or soft.
    validation: An agent with a hard-limit or approval budget on its path never appears here.
    prd_ref: FR-12, FR-05 (principal from the credential)

  failopen.budget:
    name: Budget
    meaning: The project budget the request was charged to after the ledger came back.
    unit: Text. The budget's scope name.
    source: gateway
    source_detail: Kept in the spool record and applied at replay to every budget on its limit path.
    worked_example:
      description: A request from the Ticket Triage agent.
      result: Ticket Triage
    allowed_range: Monitor and soft budgets only.
    validation: Hard-limit and approval budgets fail closed and never appear here.
    prd_ref: FR-12 (fail-open report lists the budget), SEC-06

  failopen.model:
    name: Model
    meaning: The canonical model the request was sent to. Blocks were applied before sending, so it is always an allowed model.
    unit: Text, lower case, vendor/model.
    source: gateway
    source_detail: Resolved in the registry before the request was sent.
    worked_example:
      description: A request that asked for the alias model-1.
      result: vendor-a/model-1
    allowed_range: Allowed models of allowed vendors.
    validation: A blocked or unregistered model is refused whether the ledger is up or down.
    prd_ref: FR-18 (blocks never fail open), FR-12

  failopen.amount:
    name: Amount
    meaning: What the request cost, charged to the budget when the ledger came back.
    unit: Money in the budget's currency. Stored as micro-units. Shown with two decimals, or with up to six when it is below one cent.
    source: gateway
    source_detail: From the vendor's usage figures. If the vendor gave none, the estimate made before sending.
    worked_example:
      description: A small request of about 60 output tokens costs well under one cent (885 micro-units).
      result: 0.000885 USD
    allowed_range: 0 or more.
    validation: Whole micro-units, never negative.
    prd_ref: FR-12, FR-05 (settle), FR-02

  failopen.usage:
    name: Usage
    meaning: Whether the amount is the vendor's reported usage or only the estimate made before sending.
    unit: Text.
    source: gateway
    source_detail: Recorded by the gateway after the vendor answered, or left unknown if no answer was recorded.
    worked_example:
      description: A request the vendor answered normally.
      result: Reported by the vendor
    allowed_range: Reported by the vendor, or Unknown.
    validation: Unknown usage is charged at the estimate, which is an upper bound.
    prd_ref: FR-05 (usage_known), FR-12

  failopen.replayed_at:
    name: Written to ledger
    meaning: When the spooled record was written to the ledger and charged to the budget.
    unit: Date and time, ISO 8601, stored in UTC. Shown as YYYY-MM-DD HH:MM:SS UTC.
    source: gateway
    source_detail: Set by the gateway when it replays the spool.
    worked_example:
      description: A record replayed at the demo clock time would show this value.
      result: "2026-01-15 09:00:00 UTC"
    allowed_range: Not before Time.
    validation: Each record is written once. Replaying again changes nothing.
    prd_ref: SEC-06 (replay and reconciliation), FR-12 (whether reconciled)

  failopen.acknowledged:
    name: Acknowledged
    meaning: When someone confirmed they have seen this fail-open, and who.
    unit: Date and time as YYYY-MM-DD HH:MM:SS UTC, then the actor. "Not yet" until acknowledged.
    source: user input
    source_detail: Set by the Acknowledge button on the banner.
    worked_example:
      description: A record acknowledged from this screen before sign-in exists.
      result: "2026-01-15 09:00:00 UTC, demo-operator"
    allowed_range: Any time after the record was written to the ledger.
    validation: Not possible while fail-open is active or the spool is not yet replayed.
    prd_ref: UX-7 (acknowledgement), FR-12 (fail_events.acknowledged_at)

  console.ledger_state:
    name: Ledger, as the gateway sees it
    meaning: Whether the gateway can write to the ledger. Stopping it here is a simulation for the demo, not a real outage.
    unit: Text. Running, Stopped or Unknown.
    source: gateway
    source_detail: Asked from the gateway directly.
    worked_example:
      description: The seeded demo data with the gateway running.
      result: Running
    allowed_range: Exactly one of the three.
    validation: The switch exists in demo mode only. The gateway does not offer it in production.
    prd_ref: SEC-06 (failure policy), SEC-23 (test material refused in production)

  console.agent:
    name: Agent
    meaning: The demo agent that sent the test request, with its project underneath.
    unit: Text.
    source: seed script
    source_detail: Fixed list of eight test requests in the application.
    worked_example:
      description: The first test request.
      result: ticket-triage-agent (Ticket Triage)
    allowed_range: Demo agents.
    validation: Fixed. It cannot be edited.
    prd_ref: FR-05, hard rule 2 of the owner brief (demo data)

  console.limit_kind:
    name: Budgets on its path
    meaning: Whether any budget that limits this project can stop spend. Only projects with monitor and soft budgets alone may continue during a ledger outage.
    unit: Text.
    source: calculated
    source_detail: Calculated from the policies of the budgets on the project's limit path.
    formula: |
      "Hard limit or approval on its path"  when any budget on the limit path is Hard limit or Approval
      "Monitor and soft only"               otherwise
    formula_fn: console_limit_kind
    worked_example:
      description: The Ticket Triage project. Its own, team, department and organization budgets are all soft limits.
      inputs:
        project: Ticket Triage
        policies_on_path: Soft limit, Soft limit, Soft limit, Soft limit
      result: Monitor and soft only
    allowed_range: One of the two.
    validation: Calculated only.
    prd_ref: FR-05 (policy modes and fail behavior), SEC-06, FR-04

  console.model:
    name: Requested model
    meaning: The model name the test request asked for. Some are blocked or unregistered on purpose.
    unit: Text.
    source: seed script
    source_detail: Fixed list of eight test requests in the application.
    worked_example:
      description: The sixth test request asks for an alias of a blocked vendor's model.
      result: vb-large
    allowed_range: Fixed list.
    validation: Fixed. It cannot be edited.
    prd_ref: FR-18, UX-4

  console.outcome:
    name: Outcome
    meaning: What the gateway did with the test request, in plain words, with the code the agent received.
    unit: Text, then the code in upper case.
    source: gateway
    source_detail: The gateway's answer to the test request.
    worked_example:
      description: A soft-budget request while the ledger is stopped.
      result: Sent. Sent without a budget check while the ledger was down FAIL_OPEN
    allowed_range: Only codes registered in the gateway.
    validation: The words are looked up from the code.
    prd_ref: SEC-11 (stable reason codes), SEC-06, UX-5
